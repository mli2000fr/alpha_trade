  universe_scope: raw_sec_filings
  timezone: Europe/Paris
  run_hours: "1,7,13,19"
  run_days: "1,2,3,4,5,6"
  forms: "8-K,8-K/A,6-K,6-K/A"
  log_file: log/batch/sec_corporate_events_normalize.txt

sec_institutional_ownership_normalize:
  priority: P4
  description: "Normaliser les 13F/13D/13G pour suivre le positionnement institutionnel et ses évolutions avec disponibilité PIT."
  tables: "pit_collection_runs,sec_filing_raw,sec_ownership_snapshots"
  enabled: true
  universe_scope: raw_sec_filings
  timezone: Europe/Paris
  run_hours: "3,17"
  run_days: "2,4,6"
  forms: "13F-HR,13F-HR/A,SC 13D,SC 13D/A,SC 13G,SC 13G/A"
  log_file: log/batch/sec_institutional_ownership_normalize.txt

fred_alfred_vintage_sync:
  priority: P4
  description: "Conserver les vintages macro réellement disponibles afin d'éviter toute fuite provenant des révisions économiques futures."
  tables: "pit_collection_runs,pit_raw_payloads,macro_vintage_observations"
  enabled: true
  universe_scope: macro_series
  provider: fred_alfred
  api_key_env: KEY_FRED
  timezone: Europe/Paris
  run_hours: "2,14"
  run_days: "1,2,3,4,5"
  series: "DGS2,DGS10,DGS30,T10Y2Y,T10Y3M,FEDFUNDS,CPIAUCSL,CPILFESL,PCEPI,PCEPILFE,UNRATE,PAYEMS,INDPRO,RETAILSMS,GDPC1,VIXCLS,BAMLH0A0HYM2"
  observation_lookback_days: 730
  preserve_vintages: true
  log_file: log/batch/fred_alfred_vintage_sync.txt

finra_short_volume_sync:
  priority: P1
  description: "Collecter prospectivement le short volume quotidien FINRA consolidé comme donnée de recherche, sans le promouvoir automatiquement comme signal ML."
  tables: "pit_collection_runs,pit_raw_payloads,stock_short_volume_daily"
  enabled: true
  status: ACTIVE_RESEARCH_ONLY
  provider: finra_consolidated_nms
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  timezone: America/New_York
  run_hours: "18,23"
  run_days: "1,2,3,4,5"
  lookback_days: 7
  source_url_template: "https://cdn.finra.org/equity/regsho/daily/CNMSshvol{date}.txt"
  log_file: log/batch/finra_short_volume_sync.txt

auction_imbalance_sync:
  priority: P3
  description: "Contrat réservé aux messages officiels de déséquilibre avant enchère d'ouverture/fermeture. Il doit rester désactivé : aucun collecteur quotidien n'est relié à cette entrée. Le POC NYSE Web est manuel, post-auction et non planifié."
  tables: ""
  enabled: false
  status: BLOCKED_NO_FREE_OFFICIAL_FEED
  provider: "Aucun flux officiel gratuit validé"
  research_notice: "LAISSER DÉSACTIVÉ. Passer seulement enabled à true ne lancerait aucune collecte quotidienne : aucun launcher ni tâche Windows n'est associé à ce batch. Nasdaq NOII est accessible par abonnement uniquement. Les flux NYSE Order Imbalances live et historiques TAQ complets sont commerciaux. L'interface Web NYSE gratuite expose après l'enchère environ trois mois d'historique agrégé par minute ; elle ne fournit ni API publique documentée, ni couverture Nasdaq, ni signal disponible en production avant le fixing. Le POC séparé nyse_auction_history_poc se lance uniquement à la demande et écrit des artefacts de recherche locaux, sans table, sans planification et sans serving. Le test sur l'univers a rencontré HTTP 429 après 51 réponses : il ne constitue pas un batch quotidien fiable."
  activation_requirement: "Obtenir un flux officiel Nasdaq/NYSE autorisant réception pré-auction, stockage historique et usage automatisé ; le site Web NYSE post-auction ne suffit pas à activer ce batch."
  unlock_steps:
    - "Souscrire ou valider un flux officiel couvrant Nasdaq NOII et/ou NYSE Order Imbalances avec droits de stockage historique."
    - "Vérifier la couverture des places : une source NYSE seule ne couvre pas les titres Nasdaq."
    - "Définir les champs, timestamps, séquences de mises à jour et règles available_at du contrat PIT."
    - "Créer la table SQL, la migration Alembic, le handler fournisseur et les contrôles de couverture."
    - "Valider un smoke puis l'univers complet avant de passer enabled à true et le statut à ACTIVE_RESEARCH_ONLY."
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  log_file: log/batch/auction_imbalance_sync.txt

securities_lending_sync:
  priority: P1
  description: "Contrat réservé aux borrow fees, utilization, lendable supply et shares on loan. Aucune source gratuite, automatisable et suffisamment complète n'est actuellement validée."
  tables: ""
  enabled: false
  status: PENDING_PROVIDER
  provider: "Aucun fournisseur validé"
  research_notice: "Sources essayées : IBKR TWS/API (compte et KYC requis, piste abandonnée), IBKR Public Shortstock FTP (accès non reproductible) et Eulerpool (routes lending annoncées mais absentes de l'API actuelle). Sources évaluées mais insuffisantes ou non gratuites : Alpaca, Tradier, iBorrowDesk, ChartExchange, MyAllies, ORTEX, Orbisa et S3 Partners. Conclusion : aucune source gratuite validée à ce jour pour collecter automatiquement borrow fee, shares available, utilization, lendable supply et shares on loan."
  activation_requirement: "Ne pas activer tant qu'une source PIT gratuite ou financée, documentée, automatisable et autorisant l'historisation n'a pas été validée sur un smoke réel."
  unlock_steps:
    - "Obtenir une route officielle et fonctionnelle couvrant au minimum borrow fee et shares available ; utilization, lendable supply et shares on loan restent souhaités."
    - "Vérifier le coût, les droits d'historisation, l'absence de KYC imposé si cette contrainte demeure et la couverture de l'univers complet."
    - "Définir fréquence, timestamps fournisseur, corrections, symbologie et contrat available_at."
    - "Créer la table SQL, la migration Alembic, le connecteur et les contrôles de fraîcheur/couverture."
    - "Comparer un smoke au statut Alpaca existant, puis activer seulement après validation de l'univers complet."
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  log_file: log/batch/securities_lending_sync.txt

official_options_nbbo_sync:
  priority: P2
  description: "Contrat réservé aux options officielles NBBO/OPRA avec corrections ; le pilote Alpaca disponible reste seulement indicatif."
  tables: ""
  enabled: false
  status: BLOCKED_FREE_NO_NBBO_SOURCE
  research_notice: "Besoin partiellement couvert par deux batchs actifs séparés : options_delayed_bars_sync collecte les barres OHLC, volumes, nombres de transactions et VWAP retardés Alpaca avec provenance UNVERIFIED_OPRA ; option_contract_adjustment_sync collecte prospectivement les avis d'ajustement OCC. Ces deux collectes utilisent les notifications email et Telegram communes. Elles ne fournissent ni bid/ask NBBO historique, ni tailles bid/ask, ni spread NBBO, ni provenance OPRA officiellement attestée. Le POC des transactions brutes est concluant pour la recherche seulement, mais aucun batch options_delayed_trades_sync n'est encore activé. official_options_nbbo_sync reste donc volontairement désactivé jusqu'à validation d'une source officielle."
  activation_requirement: "Choisir une source officielle OPRA/NBBO avec corrections et droits d'usage, puis implémenter le collecteur, les ajustements OCC et la persistance PIT."
  unlock_steps:
    - "Choisir une source OPRA/NBBO et vérifier les droits de téléchargement, stockage et réutilisation en backtest."
    - "Définir quotes, trades, open interest, volume, IV, Greeks et timestamps réellement disponibles."
    - "Implémenter la symbologie et les ajustements OCC pour splits, fusions et changements de contrats."
    - "Créer la table SQL, la migration Alembic, le collecteur, la pagination et les contrôles qualité."
    - "Valider coût, débit et couverture sur l'univers complet avant activation."
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  log_file: log/batch/official_options_nbbo_sync.txt
