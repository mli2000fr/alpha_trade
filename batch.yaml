# Configuration des batchs planifiés Alpha-Trade.
#
# Ce fichier sépare les paramètres d'exploitation des traitements récurrents
# de la configuration fonctionnelle générale conservée dans config.yaml.
# Les chemins relatifs sont résolus depuis la racine du projet.

# Collecte des snapshots de capitalisation Yahoo puis Finnhub.
# Les deux fournisseurs sont persistés séparément ; la politique market_cap
# de config.yaml choisit ensuite Yahoo en priorité et Finnhub en fallback.
# run_days suit DayOfWeek : 0=dimanche, 1=lundi, ... 6=samedi.
market_cap_sync:
  priority: P0
  description: "Maintenir une capitalisation et un secteur récents pour l'éligibilité tradable, les filtres de taille et la neutralisation market-cap."
  tables: "stock_fundamentals_daily"
  run_hours: "11,23"
  run_days: "1,4"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  providers: "yahoo_finance,finnhub"
  log_file: log/batch/market_cap_sync.txt

# Synchronisation du calendrier earnings Finnhub.
# symbols_file est partagé avec analyst_snapshot_collection.
earnings_calendar_sync:
  priority: P1
  description: "Connaître les publications de résultats à venir et réalisées afin d'appliquer les blackouts earnings et d'étudier les surprises."
  tables: "stock_earnings_calendar,cleaning_audit_earnings_runs"
  run_hours: "12,23"
  run_days: "0,3,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  log_file: log/batch/earnings_calendar.txt

# Collecte prospective Yahoo analyst (RESEARCH ONLY).
# Historique PIT append-only dans MySQL : consensus EPS/revenue, objectifs de
# cours et recommandations. Aucun stockage fichier des réponses métier.
analyst_snapshot_collection:
  priority: P1
  description: "Construire prospectivement des snapshots PIT Yahoo de consensus EPS/revenue, tendances et révisions EPS, objectifs de cours et recommandations."
  tables: "analyst_snapshot_collection_run,stock_analyst_estimate_history,stock_analyst_eps_trend_history,stock_analyst_eps_revision_history,stock_analyst_target_history,stock_analyst_recommendation_history"
  enabled: true
  status: ACTIVE_RESEARCH_ONLY
  provider: yahoo_finance_via_yfinance
  research_notice: "Yahoo Finance est une source non officielle sans SLA, utilisée exclusivement pour la recherche personnelle et éducative. Ces données ne sont pas une source de production licenciée et ne doivent pas être redistribuées."
  universe_name: analyst_research
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  sleep_seconds: 0.25
  timeout_seconds: 20
  max_retries: 2
  run_hours: "14,22"
  log_file: log/batch/analyst_snapshots.txt

# Tous les horaires sont exprimés dans timezone et interprétés par le lanceur.
daily_bars_sync:
  priority: P0
  description: "Collecter les clôtures OHLCV confirmées et leurs corrections pour rétablir une alimentation quotidienne auditable des prix."
  tables: "pit_collection_runs,pit_raw_payloads,stock_bars_daily_versions"
  enabled: true
  provider: business_quant
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: Europe/Paris
  run_hours: "3"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  batch_size: 100
  lookback_days: 10
  # Business Quant documente des OHLCV bruts. Ne pas les étiqueter "split"
  # dans la table canonique avant validation du moteur d'ajustement.
  canonical_upsert: false
  log_file: log/batch/daily_bars_sync.txt

security_master_snapshot:
  priority: P0
  description: "Suivre l'identité des titres, leur type, leur place de cotation et les changements d'univers sans assimiler une absence ponctuelle à un delisting."
  tables: "pit_collection_runs,pit_raw_payloads,security_master_snapshots,security_master_changes"
  enabled: true
  universe_scope: market_wide_discovery
  providers: "nasdaq_symbol_directory,business_quant"
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: Europe/Paris
  run_hours: "1,11"
  run_days: "1,2,3,4,5"
  # Même convention que run_days : 1=lundi.
  business_quant_weekdays: "1"
  log_file: log/batch/security_master_snapshot.txt

corporate_actions_sync:
  priority: P0
  description: "Conserver splits, dividendes, fusions, spin-offs, changements de ticker et delistings par source pour sécuriser prix et positions."
  tables: "pit_collection_runs,pit_raw_payloads,corporate_action_source_events"
  enabled: true
  universe_scope: market_wide
  providers: "business_quant,alpaca"
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: Europe/Paris
  run_hours: "0,8"
  run_days: "1,2,3,4,5"
  lookback_days: 7
  forward_days: 30
  market_wide: true
  log_file: log/batch/corporate_actions_sync.txt

sec_edgar_incremental:
  priority: P0
  description: "Collecter une seule fois les nouveaux dépôts SEC et fournir un RAW commun aux fondamentaux, événements et données d'actionnariat."
  tables: "pit_collection_runs,pit_raw_payloads,sec_filing_raw"
  enabled: true
  universe_scope: market_wide_filings
  timezone: Europe/Paris
  run_hours: "0,6,12,18"
  run_days: "1,2,3,4,5,6"
  user_agent_env: SEC_EDGAR_USER_AGENT
  forms: "8-K,8-K/A,6-K,6-K/A,10-Q,10-Q/A,10-K,10-K/A,13F-HR,13F-HR/A,SC 13D,SC 13D/A,SC 13G,SC 13G/A"
  lookback_days: 3
  download_primary_documents: true
  max_requests_per_second: 8
  log_file: log/batch/sec_edgar_incremental.txt

pit_data_quality_daily:
  priority: P0
  description: "Détecter quotidiennement les retards, trous de couverture et échecs de collecte avant qu'ils contaminent les features PIT."
  tables: "pit_collection_runs,pit_data_quality_metrics,pit_data_quality_issues"
  enabled: true
  timezone: Europe/Paris
  run_hours: "2,15"
  run_days: "1,2,3,4,5,6"
  bars_max_age_days: 4
  security_master_max_age_days: 8
  borrow_max_age_hours: 30
  macro_max_age_days: 10
  min_universe_coverage: 0.90
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  fail_on_critical: true
  log_file: log/batch/pit_data_quality_daily.txt

borrow_status_snapshot:
  priority: P1
  description: "Historiser la disponibilité short Alpaca et distinguer easy-to-borrow, locate requis et titre non shortable au moment de décision."
  tables: "pit_collection_runs,pit_raw_payloads,stock_borrow_status_snapshots"
  enabled: true
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  provider: alpaca
  timezone: America/New_York
  run_hours: "8,9,15"
  run_minutes: "0,25,45"
  run_days: "1,2,3,4,5"
  log_file: log/batch/borrow_status_snapshot.txt

business_quant_analyst_snapshot:
  priority: P1
  description: "Construire un historique PIT de consensus analyste sur l'univers tradable stable, indépendant des sélections produites par un modèle donné."
  tables: "pit_collection_runs,pit_raw_payloads,stock_analyst_consensus_snapshots"
  enabled: false
  status: REPLACED_BY_YAHOO
  research_notice: "Conservé uniquement comme connecteur de secours ou challenger futur. Il est volontairement désactivé car analyst_snapshot_collection via Yahoo/yfinance couvre déjà le besoin avec une meilleure couverture fonctionnelle et sans quota Business Quant. Ne pas l'activer en parallèle : cela dupliquerait la collecte de consensus analyste."
  activation_requirement: "Batch remplacé par analyst_snapshot_collection (Yahoo/yfinance). Ne l'activer que comme challenger licencié après validation explicite du quota Business Quant."
  unlock_steps:
    - "Choisir un forfait Business Quant ou un endpoint bulk couvrant au moins 1 798 symboles par métrique et par passage."
    - "Réserver dans ce quota la consommation des autres batchs Business Quant déjà actifs."
    - "Vérifier BUSINESS_QUANT_API_KEY puis exécuter un smoke explicite avec max_symbols."
    - "Mesurer couverture, erreurs 429, durée et volume stocké sur un passage complet."
    - "Retirer la limite de smoke, passer enabled à true et remplacer le statut par ACTIVE seulement après validation."
  provider: business_quant
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: America/New_York
  run_hours: "4,16"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  metrics: "eps"
  log_file: log/batch/business_quant_analyst_snapshot.txt

oracle_options_indicative_snapshot:
  priority: P2
  description: "Construire prospectivement un historique PIT de chaînes d'options Alpaca indicatives sur tout l'univers tradable stable, sans dépendre du TOP20 d'un Oracle."
  tables: "pit_collection_runs,pit_raw_payloads,stock_option_snapshots"
  enabled: true
  status: ACTIVE_RESEARCH_ONLY
  research_notice: "Alpaca Basic indicative est gratuit mais ne constitue pas un flux OPRA/NBBO : quotes modifiées et trades potentiellement retardés. Usage recherche personnelle uniquement, jamais comme prix d'exécution live."
  provider: alpaca
  feed: indicative
  timezone: America/New_York
  # Deux passages après clôture : le second est un rattrapage opérationnel.
  run_hours: "16,19"
  run_minutes: "20,0"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  target_dtes: "5,10,20"
  dte_tolerance_days: 4
  moneyness_min: 0.80
  moneyness_max: 1.20
  # Un contrat le plus proche de chaque cible, par CALL/PUT et expiration.
  moneyness_targets: "0.85,0.90,0.95,1.00,1.05,1.10,1.15"
  min_bid: 0.01
  max_relative_spread: 1.0
  require_two_sided_quote: true
  include_contract_metadata: true
  min_open_interest: 10
  allow_missing_open_interest: true
  stock_snapshot_batch_size: 100
  max_pages_per_symbol: 10
  request_interval_seconds: 0.35
  use_system_trust_store: true
  max_consecutive_failures: 5
  max_failure_ratio: 0.05
  log_file: log/batch/oracle_options_indicative_snapshot.txt

options_delayed_bars_sync:
  priority: P2
  description: "Collecter gratuitement les barres historiques retardées des options sur une surface ATM déterministe et indépendante de l'Oracle courant."
  tables: "pit_collection_runs,pit_raw_payloads,stock_option_contract_versions,stock_option_bars_delayed"
  enabled: true
  status: ACTIVE_RESEARCH_ONLY
  provider: alpaca
  research_notice: "La provenance n'est pas attestée dans le payload historique Alpaca : les lignes sont marquées UNVERIFIED_OPRA. Elles servent uniquement à la recherche, jamais à simuler un NBBO ou un prix d'exécution live. Historique disponible depuis février 2024."
  timezone: America/New_York
  run_hours: "17,23"
  run_minutes: "0"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  target_dtes: "5,10,20"
  dte_tolerance_days: 5
  timeframe: 30Min
  minimum_delay_minutes: 16
  stock_snapshot_batch_size: 100
  contract_batch_size: 100
  max_contract_pages: 5
  max_bar_pages: 20
  min_underlying_coverage: 0.20
  fail_on_quality_gate: false
  request_interval_seconds: 0.0
  use_system_trust_store: true
  log_file: log/batch/options_delayed_bars_sync.txt

option_contract_adjustment_sync:
  priority: P2
  description: "Conserver prospectivement les avis officiels OCC de Contract Adjustment et leur date de disponibilité, sans prétendre disposer automatiquement du détail complet du deliverable."
  tables: "pit_collection_runs,pit_raw_payloads,option_contract_adjustments,stock_option_contract_versions"
  enabled: true
  status: ACTIVE_RESEARCH_ONLY
  provider: occ
  research_notice: "Le RSS OCC fournit numéro, publication, catégorie, résumé et lien. Le détail des mémos est protégé par Cloudflare ; multiplier, cash component et deliverable détaillé restent inconnus tant qu'ils ne sont pas observés dans le catalogue de contrats Alpaca versionné."
  timezone: Europe/Paris
  run_hours: "7,19"
  run_minutes: "15"
  run_days: "1,2,3,4,5,6"
  universe_scope: market_wide_options_adjustments
  rss_url: "https://infomemo.theocc.com/infomemo-rss"
  use_system_trust_store: true
  log_file: log/batch/option_contract_adjustment_sync.txt

oracle_opening_window_sync:
  priority: P3
  description: "Collecter en SIP consolidé les barres minute du prémarché et de l'ouverture sur tout l'univers tradable stable, pour recherche directionnelle et politiques d'entrée retardée."
  tables: "pit_collection_runs,pit_raw_payloads,stock_opening_window_bars,stock_opening_window_bar_versions"
  enabled: true
  status: ACTIVE_RESEARCH_ONLY
  research_notice: "Alpaca SIP historique gratuit, disponible avec retard. Ce batch alimente la recherche et une éventuelle entrée retardée; il ne fournit pas une confirmation SIP temps réel à 09:30."
  provider: alpaca
  feed: sip
  adjustment: raw
  timezone: America/New_York
  run_hours: "10,18"
  run_minutes: "50,15"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  window_start: "04:00"
  window_end: "10:30"
  minimum_sip_delay_minutes: 16
  symbol_batch_size: 100
  max_pages_per_batch: 20
  request_interval_seconds: 0.0
  min_symbol_coverage: 0.75
  min_open_symbol_coverage: 0.70
  fail_on_quality_gate: true
  use_system_trust_store: true
  log_file: log/batch/oracle_opening_window_sync.txt

sec_corporate_events_normalize:
  priority: P3
  description: "Transformer localement les 8-K/6-K bruts en événements PIT structurés sans télécharger une seconde fois EDGAR."
  tables: "pit_collection_runs,sec_filing_raw,sec_corporate_events"
