# Configuration des batchs planifiés Alpha-Trade.
#
# Ce fichier sépare les paramètres d'exploitation des traitements récurrents
# de la configuration fonctionnelle générale conservée dans config.yaml.
# Les chemins relatifs sont résolus depuis la racine du projet.

# Collecte des snapshots de capitalisation Yahoo puis Finnhub.
# Les deux fournisseurs sont persistés séparément ; la politique market_cap
# de config.yaml choisit ensuite Yahoo en priorité et Finnhub en fallback.
# run_days suit DayOfWeek : 0=dimanche, 1=lundi, ... 6=samedi.
market_cap_sync:
  priority: P0
  description: "Maintenir une capitalisation et un secteur récents pour l'éligibilité tradable, les filtres de taille et la neutralisation market-cap."
  tables: "stock_fundamentals_daily"
  run_hours: "11,23"
  run_days: "1,4"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  providers: "yahoo_finance,finnhub"
  log_file: log/batch/market_cap_sync.txt

# Synchronisation du calendrier earnings Finnhub.
# symbols_file est partagé avec analyst_snapshot_collection.
earnings_calendar_sync:
  priority: P1
  description: "Connaître les publications de résultats à venir et réalisées afin d'appliquer les blackouts earnings et d'étudier les surprises."
  tables: "stock_earnings_calendar,cleaning_audit_earnings_runs"
  run_hours: "12,23"
  run_days: "0,3,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  log_file: log/batch/earnings_calendar.txt

# Collecte prospective Yahoo analyst (RESEARCH ONLY).
# Historique PIT append-only dans MySQL : consensus EPS/revenue, objectifs de
# cours et recommandations. Aucun stockage fichier des réponses métier.
analyst_snapshot_collection:
  priority: P1
  description: "Construire prospectivement des snapshots PIT Yahoo de consensus EPS/revenue, objectifs de cours et recommandations."
  tables: "analyst_snapshot_collection_run,stock_analyst_estimate_history,stock_analyst_target_history,stock_analyst_recommendation_history"
  enabled: true
  provider: yahoo
  universe_name: analyst_research
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  sleep_seconds: 0.25
  timeout_seconds: 20
  max_retries: 2
  run_hours: "23"
  log_file: log/batch/analyst_snapshots.txt

# Tous les horaires sont exprimés dans timezone et interprétés par le lanceur.
daily_bars_sync:
  priority: P0
  description: "Collecter les clôtures OHLCV confirmées et leurs corrections pour rétablir une alimentation quotidienne auditable des prix."
  tables: "pit_collection_runs,pit_raw_payloads,stock_bars_daily_versions"
  enabled: true
  provider: business_quant
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: Europe/Paris
  run_hours: "0"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  batch_size: 100
  lookback_days: 10
  # Business Quant documente des OHLCV bruts. Ne pas les étiqueter "split"
  # dans la table canonique avant validation du moteur d'ajustement.
  canonical_upsert: false
  log_file: log/batch/daily_bars_sync.txt

security_master_snapshot:
  priority: P0
  description: "Suivre l'identité des titres, leur type, leur place de cotation et les changements d'univers sans assimiler une absence ponctuelle à un delisting."
  tables: "pit_collection_runs,pit_raw_payloads,security_master_snapshots,security_master_changes"
  enabled: true
  providers: "nasdaq_symbol_directory,business_quant"
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: Europe/Paris
  run_hours: "0"
  run_days: "1,2,3,4,5"
  # Même convention que run_days : 1=lundi.
  business_quant_weekdays: "1"
  log_file: log/batch/security_master_snapshot.txt

corporate_actions_sync:
  priority: P0
  description: "Conserver splits, dividendes, fusions, spin-offs, changements de ticker et delistings par source pour sécuriser prix et positions."
  tables: "pit_collection_runs,pit_raw_payloads,corporate_action_source_events"
  enabled: true
  providers: "business_quant,alpaca"
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: Europe/Paris
  run_hours: "0,8"
  run_days: "1,2,3,4,5"
  lookback_days: 7
  forward_days: 30
  market_wide: true
  log_file: log/batch/corporate_actions_sync.txt

sec_edgar_incremental:
  priority: P0
  description: "Collecter une seule fois les nouveaux dépôts SEC et fournir un RAW commun aux fondamentaux, événements et données d'actionnariat."
  tables: "pit_collection_runs,pit_raw_payloads,sec_filing_raw"
  enabled: true
  timezone: Europe/Paris
  run_hours: "0,6,12,18"
  run_days: "1,2,3,4,5,6"
  user_agent_env: SEC_EDGAR_USER_AGENT
  forms: "8-K,8-K/A,6-K,6-K/A,10-Q,10-Q/A,10-K,10-K/A,13F-HR,13F-HR/A,SC 13D,SC 13D/A,SC 13G,SC 13G/A"
  lookback_days: 3
  download_primary_documents: true
  max_requests_per_second: 8
  log_file: log/batch/sec_edgar_incremental.txt

pit_data_quality_daily:
  priority: P0
  description: "Détecter quotidiennement les retards, trous de couverture et échecs de collecte avant qu'ils contaminent les features PIT."
  tables: "pit_collection_runs,pit_data_quality_metrics,pit_data_quality_issues"
  enabled: true
  timezone: Europe/Paris
  run_hours: "2"
  run_days: "1,2,3,4,5,6"
  bars_max_age_days: 4
  security_master_max_age_days: 8
  borrow_max_age_hours: 30
  macro_max_age_days: 10
  min_universe_coverage: 0.90
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  fail_on_critical: true
  log_file: log/batch/pit_data_quality_daily.txt

borrow_status_snapshot:
  priority: P1
  description: "Historiser la disponibilité short Alpaca et distinguer easy-to-borrow, locate requis et titre non shortable au moment de décision."
  tables: "pit_collection_runs,pit_raw_payloads,stock_borrow_status_snapshots"
  enabled: true
  provider: alpaca
  timezone: America/New_York
  run_hours: "8,9,15"
  run_minutes: "0,25,45"
  run_days: "1,2,3,4,5"
  log_file: log/batch/borrow_status_snapshot.txt

business_quant_analyst_snapshot:
  priority: P1
  description: "Évaluer un consensus analyste Business Quant prospectif sur un petit univers Oracle sans consommer inutilement le quota."
  tables: "pit_collection_runs,pit_raw_payloads,stock_analyst_consensus_snapshots"
  enabled: false
  status: PENDING_QUOTA_DECISION
  provider: business_quant
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: America/New_York
  run_hours: "16"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/oracle_top20.txt
  metrics: "eps"
  max_symbols: 20
  log_file: log/batch/business_quant_analyst_snapshot.txt

oracle_options_indicative_snapshot:
  priority: P2
  description: "Observer IV, Greeks, quotes et trades options indicatifs autour des candidats Oracle pour tester une confirmation directionnelle."
  tables: "pit_collection_runs,pit_raw_payloads,stock_option_snapshots"
  enabled: false
  status: ENABLE_AFTER_ORACLE_LIVE_SELECTION
  provider: alpaca
  feed: indicative
  timezone: America/New_York
  run_hours: "9,15,15"
  run_minutes: "31,45,59"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/oracle_top20.txt
  max_symbols: 20
  log_file: log/batch/oracle_options_indicative_snapshot.txt

oracle_opening_window_sync:
  priority: P3
  description: "Conserver la microstructure de prémarché et d'ouverture des candidats Oracle pour étudier une confirmation après le signal."
  tables: "pit_collection_runs,pit_raw_payloads,stock_opening_window_bars"
  enabled: false
  status: ENABLE_AFTER_ORACLE_LIVE_SELECTION
  provider: business_quant
  api_key_env: BUSINESS_QUANT_API_KEY
  timezone: America/New_York
  run_hours: "10"
  run_minutes: "31"
  run_days: "1,2,3,4,5"
  symbols_file: config/univers_batch/oracle_top20.txt
  max_symbols: 20
  window_start: "04:00"
  window_end: "10:30"
  fallback_window_start: "09:30"
  log_file: log/batch/oracle_opening_window_sync.txt

sec_corporate_events_normalize:
  priority: P3
  description: "Transformer localement les 8-K/6-K bruts en événements PIT structurés sans télécharger une seconde fois EDGAR."
  tables: "pit_collection_runs,sec_filing_raw,sec_corporate_events"
  enabled: true
  timezone: Europe/Paris
  run_hours: "1,7,13,19"
  run_days: "1,2,3,4,5,6"
  forms: "8-K,8-K/A,6-K,6-K/A"
  log_file: log/batch/sec_corporate_events_normalize.txt

sec_institutional_ownership_normalize:
  priority: P4
  description: "Normaliser les 13F/13D/13G pour suivre le positionnement institutionnel et ses évolutions avec disponibilité PIT."
  tables: "pit_collection_runs,sec_filing_raw,sec_ownership_snapshots"
  enabled: true
  timezone: Europe/Paris
  run_hours: "3"
  run_days: "2,4,6"
  forms: "13F-HR,13F-HR/A,SC 13D,SC 13D/A,SC 13G,SC 13G/A"
  log_file: log/batch/sec_institutional_ownership_normalize.txt

fred_alfred_vintage_sync:
  priority: P4
  description: "Conserver les vintages macro réellement disponibles afin d'éviter toute fuite provenant des révisions économiques futures."
  tables: "pit_collection_runs,pit_raw_payloads,macro_vintage_observations"
  enabled: true
  provider: fred_alfred
  api_key_env: KEY_FRED
  timezone: Europe/Paris
  run_hours: "14"
  run_days: "1,2,3,4,5"
  series: "DGS2,DGS10,DGS30,T10Y2Y,T10Y3M,FEDFUNDS,CPIAUCSL,CPILFESL,PCEPI,PCEPILFE,UNRATE,PAYEMS,INDPRO,RETAILSMS,GDPC1,VIXCLS,BAMLH0A0HYM2"
  observation_lookback_days: 730
  preserve_vintages: true
  log_file: log/batch/fred_alfred_vintage_sync.txt

finra_short_volume_sync:
  priority: P1
  description: "Contrôle optionnel du short volume consolidé FINRA ; la famille reste désactivée après résultats de recherche non concluants."
  tables: ""
  enabled: false
  status: OPTIONAL_CONTROL_NO_GO_FAMILY
  timezone: America/New_York
  run_hours: "18"
  run_days: "1,2,3,4,5"
  log_file: log/batch/finra_short_volume_sync.txt

auction_imbalance_sync:
  priority: P3
  description: "Contrat réservé aux déséquilibres d'enchère d'ouverture/fermeture ; aucun fournisseur PIT n'est actuellement validé."
  tables: ""
  enabled: false
  status: PENDING_PROVIDER
  log_file: log/batch/auction_imbalance_sync.txt

securities_lending_sync:
  priority: P1
  description: "Contrat réservé aux borrow fees, utilization, lendable supply et shares on loan ; fournisseur encore manquant."
  tables: ""
  enabled: false
  status: PENDING_PROVIDER
  log_file: log/batch/securities_lending_sync.txt

official_options_nbbo_sync:
  priority: P2
  description: "Contrat réservé aux options officielles NBBO/OPRA avec corrections ; le pilote Alpaca disponible reste seulement indicatif."
  tables: ""
  enabled: false
  status: PENDING_PROVIDER
  log_file: log/batch/official_options_nbbo_sync.txt
