[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha_trade"
version = "0.1.0"
description = "Enterprise-grade US Swing Trade system"
requires-python = ">=3.12"
dependencies = [
    "pymysql",
    "cryptography",
    "requests",
    "certifi",
    "python-dotenv",
    "sqlalchemy",
    "pandas",
    "numpy",
    "polars",
    "python-dateutil",
    "pytz",
    "pandas-market-calendars",
    "transformers",
    "torch",
    "lightning",
    "torchmetrics",
    "lightgbm",
    "streamlit",
    "pyyaml",
    "vectorbt>=0.26",
    "plotly",
    "kaleido",
    "matplotlib",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
    "types-pytz",
    "types-python-dateutil",
    "sqlalchemy[mypy]",
    # Phase 7.1 — discipline d'imports (audit_global §7.1).
    "import-linter>=2.0",
]
observability = [
    # Phase 7.5 — endpoint /metrics minimal (audit_global §7.5).
    "prometheus-client>=0.20",
]
ml-challengers = [
    "catboost",
]
cross-check = [
    # Compatibilité historique : yfinance est désormais une dépendance runtime.
]
# Phase C — dépendances optionnelles (S15-S18)
formal = [
    "z3-solver>=4.13",
]
reporting = [
    "reportlab>=4",
]
lineage = [
    "neo4j>=5",
]
cache = [
    "redis>=5",
]
async-db = [
    "aiosqlite>=0.20",
]
security = [
    "cyclonedx-bom>=4",
    "pip-audit>=2.7",
]
mutation = [
    "mutmut>=2.5",
]
# Sprint S5 — orchestration pipeline (opt-in)
orchestration = [
    "prefect>=2.0",
]

# ---------------------------------------------------------------------------
# setuptools : déclare tous les packages pour que pip install -e . fonctionne
# et que conftest.py n'ait plus besoin de manipuler sys.path.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "core*",
    "database*",
    "dataIntegrityEngine*",
    "event_sentiment*",
    "screener*",
    "selector*",
    "service*",
    "risk_management*",
    "execution_engine*",
    "modelFactory*",
    "corporate_actions*",
    "backtesting*",
    "ihm*",
    # Phase C — packages institutionnels
    "formal*",
    "reporting*",
    "tax*",
    "lineage*",
    # Sprint S5 — orchestration pipeline
    "flows*",
]

# ---------------------------------------------------------------------------
# Phase C / S14 — mutation testing scope (mutmut)
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = "risk_management/,execution_engine/,corporate_actions/"
runner = "pytest -x -q --no-cov"
backup = false

# ---------------------------------------------------------------------------
# ruff — linter rapide (remplace flake8 + isort + pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (géré par line-length)
    "B008",   # do not perform function calls in default arguments
    "SIM108", # ternary vs if/else (lisibilité)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert autorisé dans les tests

# ---------------------------------------------------------------------------
# mypy — vérification statique des types
# (config complète dans mypy.ini pour compatibilité IDE)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true


