[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --tb=short
    --strict-markers
    --strict-config
    --cov=.
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-fail-under=70
    # Phase F / S22.1 — montée progressive : 60 → 70 (S26.1, ratchet déjà atteint sans nouveaux tests)
    #                                       → 75 (S26.1 cible) → 85 (S26.1.b) → 90 (S26.1.c).
    # Le seuil branches > 95 % sur risk_management/, execution_engine/, corporate_actions/
    # est vérifié hors-pytest par scripts/check_branch_coverage_critical.py.

# Marqueurs personnalisés — à déclarer ici pour éviter PytestUnknownMarkWarning
markers =
    unit: tests unitaires rapides (pas de DB, pas de réseau)
    integration: tests d'intégration (nécessite MySQL)
    slow: tests > 5s (FinBERT, grand volume de données)
    e2e: tests E2E IHM via streamlit.testing.v1.AppTest (Sprint S6)
    property: tests property-based via hypothesis (Phase C / S14)
    formal: preuves formelles via z3-solver (Phase C / S15)
    benchmark: micro-benchmarks pytest-benchmark (Phase C / S17)
    live: tests live nécessitant un service externe (Docker, TWS, Neo4j) — Sprint S21

# Filtre les warnings connus non-actionnables
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy
    ignore::PendingDeprecationWarning
