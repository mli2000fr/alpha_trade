database:
  host: localhost
  port: 3306
  # Sprint S5 / A-013 — credentials lus exclusivement depuis l'environnement
  # (LOGIN_DB / PASSWORD_DB) par database/connection.py. Les clés ci-dessous
  # ne sont **plus** consommées en code mais conservent le placeholder à
  # titre documentaire pour le scanner secrets.
  user: "${LOGIN_DB}"
  password: "${PASSWORD_DB}"
  name: alpha_trade

alpaca:
  # Sprint S5 / A-013 — plus aucune clé en clair acceptée à la racine.
  # Les credentials par compte vivent exclusivement sous `accounts:` ci-dessous,
  # via placeholders ${VAR} résolus par `service.alpaca.accounts.AccountRegistry`.
  # (Ancien bloc `api_key: "PK..."` / `secret_key: "..."` retiré ; le scanner
  # `core.secrets.scan_yaml_for_literal_secrets` échouerait sinon.)

  # Multi-comptes : liste de comptes broker Alpaca
  # Chaque compte est identifié par un 'id' unique.
  # Les credentials peuvent être en clair ou via placeholder env var ${VAR_NAME}.
  accounts:
    - id: default
      label: "Compte principal (paper)"
      api_key: "${ALPACA_API_KEY}"
      secret_key: "${ALPACA_SECRET_KEY}"
      mode: paper
    - id: test1
      label: "Compte test 1 (paper)"
      api_key: "${ALPACA_KEY_CPT_1}"
      secret_key: "${ALPACA_SECRET_CPT_1}"
      mode: paper
    - id: test2
      label: "Compte test 2 (paper)"
      api_key: "${ALPACA_KEY_CPT_2}"
      secret_key: "${ALPACA_SECRET_CPT_2}"
      mode: paper
    # - id: live1
    #   label: "Compte live"
    #   api_key: "${ALPACA_LIVE1_API_KEY}"
    #   secret_key: "${ALPACA_LIVE1_SECRET_KEY}"
    #   mode: live

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05

leverage:
  # Active ou désactive la politique explicite de levier.
  # - false : comportement historique conservé
  # - true  : applique les garde-fous du bloc `leverage`
  enabled: true

  # Mode fonctionnel du levier.
  # Valeurs possibles :
  # - disabled   : désactive la feature ; `enabled` est alors sans effet pratique
  # - regt_swing : levier long-only borné pour le swing overnight, avec lecture
  #                prioritaire du buying power Reg-T broker (`regt_buying_power`)
  mode: regt_swing

  # Levier notionnel maximal visé par la stratégie.
  # Exemples :
  # - 1.0 = pas de levier additionnel
  # - 1.5 = exposition cible max = 150 % de l'equity
  # - 2.0 = plafond absolu autorisé en swing overnight
  # NB : même si une valeur > 2.0 était saisie, le code borne de toute façon à 2.0 max.
  max_leverage: 1.5

  # Equity minimale requise pour autoriser la politique de levier.
  # En dessous, le levier explicite est désactivé automatiquement.
  min_equity_usd: 2000

  # Si true, la politique de levier n'est autorisée que sur un compte `margin`.
  # Si false, la config peut théoriquement être chargée aussi sur d'autres types
  # de compte, mais les garde-fous runtime restent prioritaires.
  require_margin_account: true

  # Restreint l'activation à certains modes d'entrée.
  # Valeurs possibles :
  # - normal : le levier explicite n'est autorisé qu'en mode d'entrée normal
  # - any    : n'impose pas ce filtre spécifique (les autres garde-fous restent actifs)
  only_in_entry_mode: normal

  # Si true, coupe explicitement le levier quand le régime a basculé en
  # `capital_preservation`, même si le compte est margin et l'equity suffisante.
  disable_in_capital_preservation: true

  # Détermine le comportement si aucun champ de buying power prioritaire n'est
  # disponible dans le snapshot broker.
  # - true  : désactive la politique de levier explicite dans ce cas
  # - false : fallback défensif sans crash, avec journalisation de la raison
  disable_if_buying_power_field_missing: false

  # Ordre de priorité des champs lus dans le snapshot broker Alpaca.
  # Le premier champ présent et exploitable est utilisé.
  # Valeurs courantes :
  # - regt_buying_power        : buying power Reg-T, prioritaire pour le swing margin
  # - buying_power             : buying power générique broker
  # D'autres champs pourraient être ajoutés plus tard si le contrat broker évolue.
  buying_power_field_priority:
    - regt_buying_power
    - buying_power

  # Levier simulé utilisé en `dry_run` quand la politique explicite est active.
  # Exemples :
  # - 1.0 = simulation sans levier additionnel
  # - 1.25 / 1.5 = simulation prudente
  # - 2.0 = plafond maximal autorisé
  dry_run_simulated_leverage: 1.5

  # Active les logs d'audit du moteur de levier.
  # Si true, les décisions de levier (actif/inactif, champ broker retenu,
  # budget effectif, raison de fallback) sont journalisées.
  audit_log: true

# ---------------------------------------------------------------------------
# Sprint S30 — Couche centralisée Market-Aware (Axe A du plan ``prompt/parttern/plan.md``).
# Profil par défaut promu : variante gagnante R13a (calibration régime validée
# en ablation 2026-06), désormais intégrée directement dans ``config.yaml``.
# Quand ``market_regimes.enabled = false`` la couche reste désactivée et le
# comportement historique du dépôt est strictement préservé.
# Cf. ``service/market/`` et ``risk_management/regime_apply.py``.
# ---------------------------------------------------------------------------
market_regimes:
  enabled: true                             # bascule globale (off par défaut)
  cache_ttl_seconds: 300
  enforce_min_notional: 155                  # cf. plan §C16, compatible Alpaca
  allow_neutral_fallback_on_missing_macro_data: true
  macro_pit_mode_backtest: asof_inclusive    # asof_inclusive | j_minus_1_strict
  # Source des donnees macro (VIX, 10Y) : `stooq` (gratuit, sans cle),
  # `eodhd` (consomme du quota EODHD), `composite` (Stooq dabord, EODHD
  # en secours si EODHD_API_TOKEN est defini), ou `none` pour desactiver.
  macro_provider: eodhd

  sentinel:
    enabled: true
    preflight_summary: true

  hysteresis:
    enabled: true
    enter_soft_signals_required: 1
    enter_confirm_days: 2
    exit_soft_signals_max: 0
    exit_confirm_days: 3
    min_hold_days_defensive: 5
    hard_trigger_immediate: true
    hard_exit_confirm_days: 2
    gate_soft_constraints_on_confirmed_entry: true

  vix:
    enabled: true
    symbol: "VIX.INDX"
    short_symbol: "VIX9D.INDX"
    high_threshold: 30.0
    inverted_curve_mode: close_only
    inverted_curve_min_spread: 1.5
    inverted_curve_min_ratio: 1.03

  capital_preservation_max_gross_exposure: 0.65

  yields:
    enabled: true
    provider: fred                         # default | stooq | eodhd | fred
    symbol_10y: "US10Y"
    fred_series_10y: "DGS10"             # FRED 10Y constant maturity treasury
    lookback_days: 5
    relative_spike_threshold: 0.07
    block_sectors: ["Technology", "Tech", "Growth", "Real Estate", "Consumer Cyclical", "Financial Services"]
    block_high_beta: true
    high_beta_threshold: 1.2
    risk_mult: 0.85
    soft_max_positions: 3
    soft_max_position_weight: 0.25
    soft_max_sector_weight: 0.30
    soft_max_gross_exposure: 0.65
    hard_relative_spike_threshold: 0.10
    hard_block_sectors: ["Technology", "Tech", "Growth", "Real Estate", "Consumer Cyclical", "Financial Services"]
    hard_risk_mult: 0.30
    hard_mode_live: close_only
    hard_mode_backtest: close_only
    hard_requires_vix_high: true
    hard_requires_sentiment_warning: false
    hard_max_positions: 1
    hard_max_position_weight: 0.15
    hard_max_sector_weight: 0.20
    hard_max_gross_exposure: 0.35

  sentiment_circuit_breaker:
    enabled: true
    lookback_days: 7
    warning_threshold: -0.20
    critical_threshold: -0.40
    warning_max_positions: 3
    critical_mode_live: close_only
    critical_mode_backtest: close_only

  sector_limits:
    enabled: false
    max_tickers_per_sector: 2

  earnings_shield:
    enabled: false
    days_before: 2
    days_after: 2
    mode: strict_block         # strict_block | negative_score
    negative_score_value: -1.0

  buyback_blackout:
    enabled: false
    days_before_earnings: 14
    ml_score_multiplier: 0.70

  patterns:
    tax_day:
      enabled: false
      start: "04-10"
      end: "04-20"
      risk_mult: 0.4
    sept_slump:
      enabled: false
      start: "09-15"
      end: "10-15"
      risk_mult: 0.4
    santa_rally:
      enabled: false
      start: "12-20"
      end: "12-31"
      risk_mult: 1.15
      screener_expansion_pct: 0.10
    january_effect:
      enabled: false
      start: "01-02"
      end: "01-15"
      risk_mult: 1.10
      screener_expansion_pct: 0.10
    institutional_opex:
      enabled: false
      rule: "3rd_friday"
      mode: sentiment_hardening   # sentiment_hardening | block_entries
      sentiment_threshold_addon: 0.20
    month_end:
      enabled: false
      business_days_from_month_end: 2
      sentiment_threshold_addon: 0.10

fred:
  api_key_env: KEY_FRED
  series_10y: DGS10

# ---------------------------------------------------------------------------
# Sprint S30 — Trailing stop ATR dynamique pour les achats manuels orphelins
# (Axe F du plan ``prompt/parttern/plan.md``). Lu par ``execution_engine/config.py``
# (TrailingStopConfig) via ``service.market.parse_trailing_stop``.
# ---------------------------------------------------------------------------
risk_management:
  empirical_calibration:
    # Politique de fallback live pour `weights_calibration_runs`.
    # Chaque niveau tente de résoudre un segment éligible (`eligible_for_live=1`).
    # L'ordre ci-dessous reproduit le comportement P3+ par défaut.
    fallback_levels:
      - exact_segment
      - regime_all
      - same_regime_nearest_window
      - regime_all_nearest_window
      - same_regime_nearest_horizon
      - regime_all_nearest_horizon
      - same_regime_nearest_segment
      - regime_all_nearest_segment
  trailing_stop:
    enabled: false
    mode: dynamic_atr            # fixed | dynamic_atr
    atr_period: 14
    atr_multiplier: 2.5
    fallback_fixed_pct: 5.0
    break_even_after_atr_multiple: 2.0
    eod_check_time_est: "15:50"
    apply_to_manual_orphan_buys: true
  # Time Stop : coupe la position au marché si elle stagne trop longtemps.
  # Exemple cible: 15 à 25 jours ouvrés (valeur recommandée ici: 20).
  time_stop:
    enabled: true
    max_business_days: 20
    min_tp_progress_ratio: 0.50
    near_zero_return_pct: 0.005

  # Force-close sur circuit breaker : liquide les positions les plus
  # perdantes quand le drawdown atteint max_portfolio_drawdown_pct.
  # force_close_on_breaker: true  = active la liquidation
  # force_close_pct: 0.50         = fraction des positions liquidées
  force_close_on_breaker: true
  force_close_pct: 1.0

  # Sprint 0 short — feature flag global (cf. plan_v2.md §C8)
  # Active le pipeline long+short. false = long-only (comportement actuel)
  short_selling_enabled: false


# ---------------------------------------------------------------------------
# Source primaire des barres OHLCV (`stock_bars` + `stock_bars_daily`).
# Voir prompt/iex/plan_eodhd.md.
# - alpaca : comportement historique (Alpaca/IEX, biais volume IEX).
# - eodhd  : EODHD bulk EOD (volume consolidé proxy, recommandé).
# - Aucun fallback automatique inter-provider n'est implémenté : le switch est
#   explicite via `market_data.bars_provider` (config/IHM). En cas d'échec du
#   provider actif, le run doit échouer ou être relancé après changement
#   opérateur assumé.
# La metadata (stock_metadata), les quotes live et l'exécution restent
# toujours sur Alpaca quel que soit ce flag.
# ---------------------------------------------------------------------------
market_data:
  bars_provider: eodhd   # alpaca | eodhd  (défaut recommandé : eodhd — pilotable depuis IHM › Paramètres)

eodhd:
  # NB : l'activation runtime se pilote via market_data.bars_provider.
  # Aucun flag `enabled` ici (cf. audit S1 / A-002 : clé fantôme supprimée).
  api_token_env: EODHD_API_TOKEN          # Variable d'env contenant le token.
  exchange: US                            # NYSE + NASDAQ + AMEX consolidés.
  cache_dir: artifacts/eodhd_cache
  daily_quota: 100000                     # Plan All-In-One 19,99 $/mois.
  soft_quota_warn: 80000
  bulk_publish_offset_hours: 2            # Délai post-clôture avant que le bulk soit fiable.
  splits_cache_ttl_days: 7
  circuit_breaker:
    consecutive_failures: 5
    cooldown_minutes: 30


# Sprint S8 - Calibration formelle des poids de conviction (cf. core/conviction.py)
conviction:
  # Poids de fusion sentiment (somme = 1.0). Defauts historiques : 0.75 / 0.15 / 0.10.
  quant_weight: 0.75
  sentiment_weight: 0.15
  macro_weight: 0.10

