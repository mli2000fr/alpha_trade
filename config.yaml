database:
  host: localhost
  port: 3306
  user: user
  password: pass
  name: alpha_trade

alpaca:
  # Compte par défaut (rétrocompatibilité)
  api_key: "PK..."
  secret_key: "..."

  # Multi-comptes : liste de comptes broker Alpaca
  # Chaque compte est identifié par un 'id' unique.
  # Les credentials peuvent être en clair ou via placeholder env var ${VAR_NAME}.
  accounts:
    - id: default
      label: "Compte principal (paper)"
      api_key: "${ALPACA_API_KEY}"
      secret_key: "${ALPACA_SECRET_KEY}"
      mode: paper
    - id: test1
      label: "Compte test 1 (paper)"
      api_key: "${ALPACA_KEY_CPT_1}"
      secret_key: "${ALPACA_SECRET_CPT_1}"
      mode: paper
    - id: test2
      label: "Compte test 2 (paper)"
      api_key: "${ALPACA_KEY_CPT_2}"
      secret_key: "${ALPACA_SECRET_CPT_2}"
      mode: paper
    # - id: live1
    #   label: "Compte live"
    #   api_key: "${ALPACA_LIVE1_API_KEY}"
    #   secret_key: "${ALPACA_LIVE1_SECRET_KEY}"
    #   mode: live

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05

# ---------------------------------------------------------------------------
# Source primaire des barres OHLCV (`stock_bars` + `stock_bars_daily`).
# Voir prompt/iex/plan_eodhd.md.
# - alpaca : comportement historique (Alpaca/IEX, biais volume IEX).
# - eodhd  : EODHD bulk EOD (volume consolidé proxy, recommandé).
# La metadata (stock_metadata), les quotes live et l'exécution restent
# toujours sur Alpaca quel que soit ce flag.
# ---------------------------------------------------------------------------
market_data:
  bars_provider: alpaca   # alpaca | eodhd
  fallback_on_failure: true

eodhd:
  enabled: false                          # Phase 1 : désactivé par défaut.
  api_token_env: EODHD_API_TOKEN          # Variable d'env contenant le token.
  exchange: US                            # NYSE + NASDAQ + AMEX consolidés.
  cache_dir: artifacts/eodhd_cache
  daily_quota: 100000                     # Plan All-In-One 19,99 $/mois.
  soft_quota_warn: 80000
  bulk_publish_offset_hours: 2            # Délai post-clôture avant que le bulk soit fiable.
  splits_cache_ttl_days: 7
  circuit_breaker:
    consecutive_failures: 5
    cooldown_minutes: 30

