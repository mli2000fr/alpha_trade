database:
  host: localhost
  port: 3306
  # Sprint S5 / A-013 — credentials lus exclusivement depuis l'environnement
  # (LOGIN_DB / PASSWORD_DB) par database/connection.py. Les clés ci-dessous
  # ne sont **plus** consommées en code mais conservent le placeholder à
  # titre documentaire pour le scanner secrets.
  user: "${LOGIN_DB}"
  password: "${PASSWORD_DB}"
  name: alpha_trade

alpaca:
  # Sprint S5 / A-013 — plus aucune clé en clair acceptée à la racine.
  # Les credentials par compte vivent exclusivement sous `accounts:` ci-dessous,
  # via placeholders ${VAR} résolus par `service.alpaca.accounts.AccountRegistry`.
  # (Ancien bloc `api_key: "PK..."` / `secret_key: "..."` retiré ; le scanner
  # `core.secrets.scan_yaml_for_literal_secrets` échouerait sinon.)

  # Multi-comptes : liste de comptes broker Alpaca
  # Chaque compte est identifié par un 'id' unique.
  # Les credentials peuvent être en clair ou via placeholder env var ${VAR_NAME}.
  accounts:
    - id: default
      label: "Compte principal (paper)"
      api_key: "${ALPACA_API_KEY}"
      secret_key: "${ALPACA_SECRET_KEY}"
      mode: paper
      long_only: true
    - id: test1
      label: "Compte test 1 (paper)"
      api_key: "${ALPACA_KEY_CPT_1}"
      secret_key: "${ALPACA_SECRET_CPT_1}"
      mode: paper
      long_only: true
    - id: test2
      label: "Compte test 2 (paper)"
      api_key: "${ALPACA_KEY_CPT_2}"
      secret_key: "${ALPACA_SECRET_CPT_2}"
      mode: paper
      long_only: true
    # - id: live1
    #   label: "Compte live"
    #   api_key: "${ALPACA_LIVE1_API_KEY}"
    #   secret_key: "${ALPACA_LIVE1_SECRET_KEY}"
    #   mode: live

risk:
  # ── E46 (2026-08-22) : seuils distingués PROD vs BACKTEST ──
  # prod_* = live (RiskConfig) ; backtest_* = backtests (default --max-portfolio-dd-pct).
  prod_max_drawdown: 0.15
  prod_max_daily_loss: 0.025
  backtest_max_drawdown: 0.15
  backtest_max_daily_loss: 0.025
  # legacy fallback (si les clés _prod/_backtest sont absentes) :
  max_drawdown: 0.15
  max_daily_loss: 0.05

leverage:
  # Active ou désactive la politique explicite de levier.
  # - false : comportement historique conservé
  # - true  : applique les garde-fous du bloc `leverage`
  enabled: true

  # Mode fonctionnel du levier.
  # Valeurs possibles :
  # - disabled   : désactive la feature ; `enabled` est alors sans effet pratique
  # - regt_swing : levier long-only borné pour le swing overnight, avec lecture
  #                prioritaire du buying power Reg-T broker (`regt_buying_power`)
  mode: regt_swing

  # Levier notionnel maximal visé par la stratégie.
  # Exemples :
  # - 1.0 = pas de levier additionnel
  # - 1.5 = exposition cible max = 150 % de l'equity
  # - 2.0 = plafond absolu autorisé en swing overnight (compte live Alpaca)
  # NB : même si une valeur > 2.0 était saisie, le code borne de toute façon à 2.0 max.
  max_leverage: 2.0

  # Equity minimale requise pour autoriser la politique de levier.
  # En dessous, le levier explicite est désactivé automatiquement.
  min_equity_usd: 2000

  # Si true, la politique de levier n'est autorisée que sur un compte `margin`.
  # Si false, la config peut théoriquement être chargée aussi sur d'autres types
  # de compte, mais les garde-fous runtime restent prioritaires.
  require_margin_account: true

  # Restreint l'activation à certains modes d'entrée.
  # Valeurs possibles :
  # - normal : le levier explicite n'est autorisé qu'en mode d'entrée normal
  # - any    : n'impose pas ce filtre spécifique (les autres garde-fous restent actifs)
  only_in_entry_mode: normal

  # Si true, coupe explicitement le levier quand le régime a basculé en
  # `capital_preservation`, même si le compte est margin et l'equity suffisante.
  disable_in_capital_preservation: true

  # Détermine le comportement si aucun champ de buying power prioritaire n'est
  # disponible dans le snapshot broker.
  # - true  : désactive la politique de levier explicite dans ce cas
  # - false : fallback défensif sans crash, avec journalisation de la raison
  disable_if_buying_power_field_missing: false

  # Ordre de priorité des champs lus dans le snapshot broker Alpaca.
  # Le premier champ présent et exploitable est utilisé.
  # Valeurs courantes :
  # - regt_buying_power        : buying power Reg-T, prioritaire pour le swing margin
  # - buying_power             : buying power générique broker
  # D'autres champs pourraient être ajoutés plus tard si le contrat broker évolue.
  buying_power_field_priority:
    - regt_buying_power
    - buying_power

  # Levier simulé utilisé en `dry_run` quand la politique explicite est active.
  # Exemples :
  # - 1.0 = simulation sans levier additionnel
  # - 1.25 / 1.5 = simulation prudente
  # - 2.0 = plafond maximal autorisé (aligné compte live)
  dry_run_simulated_leverage: 2.0

  # Active les logs d'audit du moteur de levier.
  # Si true, les décisions de levier (actif/inactif, champ broker retenu,
  # budget effectif, raison de fallback) sont journalisées.
  audit_log: true

# ---------------------------------------------------------------------------
# Sprint S30 — Couche centralisée Market-Aware (Axe A du plan ``prompt/parttern/plan.md``).
# Profil par défaut promu : variante gagnante R13a (calibration régime validée
# en ablation 2026-06), désormais intégrée directement dans ``config.yaml``.
# Quand ``market_regimes.enabled = false`` la couche reste désactivée et le
# comportement historique du dépôt est strictement préservé.
# Cf. ``service/market/`` et ``risk_management/regime_apply.py``.
# ---------------------------------------------------------------------------
market_regimes:
  enabled: true                             # bascule globale (off par défaut)
  cache_ttl_seconds: 300
  enforce_min_notional: 155                  # cf. plan §C16, compatible Alpaca
  allow_neutral_fallback_on_missing_macro_data: true
  macro_pit_mode_backtest: asof_inclusive    # asof_inclusive | j_minus_1_strict
  # Source des donnees macro (VIX, 10Y) : `stooq` (gratuit, sans cle),
  # `eodhd` (consomme du quota EODHD), `composite` (Stooq dabord, EODHD
  # en secours si EODHD_API_TOKEN est defini), ou `none` pour desactiver.
  macro_provider: eodhd

  sentinel:
    enabled: true
    preflight_summary: true

  hysteresis:
    enabled: true
    enter_soft_signals_required: 1
    enter_confirm_days: 2
    exit_soft_signals_max: 0
    exit_confirm_days: 1
    min_hold_days_defensive: 1
    hard_trigger_immediate: true
    hard_exit_confirm_days: 1
    gate_soft_constraints_on_confirmed_entry: true

  vix:
    enabled: true
    symbol: "VIX.INDX"
    short_symbol: "VIX9D.INDX"
    high_threshold: 30.0
    inverted_curve_mode: capital_preservation
    inverted_curve_min_spread: 1.5
    inverted_curve_min_ratio: 1.03

  # Nasdaq-100 Volatility Index (CBOE VXN)
  vxn:
    enabled: true
    symbol: "VXN.INDX"
    high_threshold: 23.0

  # VIX 3-Month — term structure (contango/backwardation)
  vix3m:
    enabled: true
    symbol: "VIX3M.INDX"
    backwardation_threshold: 1.0

  # ICE BofA Bond Volatility Index (MOVE)
  move:
    enabled: true
    symbol: "MOVE.INDX"
    high_threshold: 120.0

  # Russell 2000 Volatility Index (CBOE RVX) — Small Caps
  rvx:
    enabled: false
    symbol: "RVX.INDX"
    high_threshold: 30.0

  capital_preservation_max_gross_exposure: 0.65

  # ── CP-V2 (2026-08-22) — capital_preservation side-aware + release fixe ──
  # policy: prod_legacy | cp_v2.
  # cp_v2 : LONG plafonné à 0.40 ; SHORT = capacité normale du sleeve 2-short
  # réservée (0.25) à l'intérieur du gross CP 0.65 ; release fixe = 5 séances
  # après le dernier signal CP (retour normal à J+6). Hystérésis de sortie
  # resserrée ci-dessus (exit_confirm 1j / min_hold 1 / hard_exit_confirm 1j).
  capital_preservation_policy: cp_v2
  capital_preservation_max_long_exposure: 0.40
  capital_preservation_reserved_short_exposure: 0.25
  capital_preservation_release_sessions: 5

  yields:
    enabled: true
    provider: fred                         # default | stooq | eodhd | fred
    symbol_10y: "US10Y"
    fred_series_10y: "DGS10"             # FRED 10Y constant maturity treasury
    lookback_days: 5
    relative_spike_threshold: 0.07
    block_sectors: ["Technology", "Tech", "Growth", "Real Estate", "Consumer Cyclical", "Financial Services"]
    block_high_beta: true
    high_beta_threshold: 1.2
    risk_mult: 0.85
    soft_max_positions: 3
    soft_max_position_weight: 0.25
    soft_max_sector_weight: 0.30
    soft_max_gross_exposure: 0.65
    hard_relative_spike_threshold: 0.10
    hard_block_sectors: ["Technology", "Tech", "Growth", "Real Estate", "Consumer Cyclical", "Financial Services"]
    hard_risk_mult: 0.30
    hard_mode_live: capital_preservation
    hard_mode_backtest: capital_preservation
    hard_requires_vix_high: true
    hard_requires_sentiment_warning: false
    hard_max_positions: 1
    hard_max_position_weight: 0.15
    hard_max_sector_weight: 0.20
    hard_max_gross_exposure: 0.35

  sentiment_circuit_breaker:
    enabled: true
    lookback_days: 7
    warning_threshold: -0.20
    critical_threshold: -0.40
    warning_max_positions: 3
    critical_mode_live: capital_preservation
    critical_mode_backtest: capital_preservation

  sector_limits:
    enabled: true
    max_tickers_per_sector: 2

  earnings_shield:
    enabled: false
    days_before: 2
    days_after: 2
    mode: strict_block         # strict_block | negative_score
    negative_score_value: -1.0

  buyback_blackout:
    enabled: false
    days_before_earnings: 14
    ml_score_multiplier: 0.70

  patterns:
    tax_day:
      enabled: false
      start: "04-10"
      end: "04-20"
      risk_mult: 0.4
    sept_slump:
      enabled: false
      start: "09-15"
      end: "10-15"
      risk_mult: 0.4
    santa_rally:
      enabled: false
      start: "12-20"
      end: "12-31"
      risk_mult: 1.15
      screener_expansion_pct: 0.10
    january_effect:
      enabled: false
      start: "01-02"
      end: "01-15"
      risk_mult: 1.10
      screener_expansion_pct: 0.10
    institutional_opex:
      enabled: false
      rule: "3rd_friday"
      mode: sentiment_hardening   # sentiment_hardening | block_entries
      sentiment_threshold_addon: 0.20
    month_end:
      enabled: false
      business_days_from_month_end: 2
      sentiment_threshold_addon: 0.10

fred:
  api_key_env: KEY_FRED
  series_10y: DGS10

# ---------------------------------------------------------------------------
# Selector / Alpha Scanner — tailles de selection long et short.
# Lu par ``selector/config.py`` (AlphaScannerConfig) en fallback des defauts
# code. Les valeurs IHM (pipeline_runner.py) prennent priorite si definies.
# ---------------------------------------------------------------------------
selector:
  selection_size: 100            # candidats long (top N par final_score)
  short_selection_size: 100      # candidats short (top N par short_score, 0 = desactive)

# ---------------------------------------------------------------------------
# Sprint S30 — Trailing stop ATR dynamique pour les achats manuels orphelins
# (Axe F du plan ``prompt/parttern/plan.md``). Lu par ``execution_engine/config.py``
# (TrailingStopConfig) via ``service.market.parse_trailing_stop``.
# ---------------------------------------------------------------------------
risk_management:
  empirical_calibration:
    # Politique de fallback live pour `weights_calibration_runs`.
    # Chaque niveau tente de résoudre un segment éligible (`eligible_for_live=1`).
    # L'ordre ci-dessous reproduit le comportement P3+ par défaut.
    fallback_levels:
      - exact_segment
      - regime_all
      - same_regime_nearest_window
      - regime_all_nearest_window
      - same_regime_nearest_horizon
      - regime_all_nearest_horizon
      - same_regime_nearest_segment
      - regime_all_nearest_segment
  # ── P2-1 sizing live (2026-08-13) ──
  # "atr" = legacy (budget de risque ATR égal par position).
  # "rank_weighted" = facteurs d'allocation depuis selection_rank.
  # "conviction_weighted" = facteurs d'allocation depuis conviction_score.
  # Les multiplicateurs sectoriels s'activent via `sector_multipliers_path`
  # (JSON {secteur: facteur}, cf. config/p21_sector_multipliers.json).
  sizing_mode: "atr"
  # sector_multipliers_path: "config/p21_sector_multipliers.json"
  # ── E46 (2026-08-22) : multiplicateur d'exposition PUR — PROD vs BACKTEST ──
  # Scale le sizing des entrées LONG et SHORT SANS toucher CP-V2 / B4 / WORST_50 / 6L/2S.
  #   1.0  = comportement inchangé (rollback).
  #   1.46 = niveau retenu E46.
  #   1.69 = profil agressif non promu (candidat futur).
  # prod_* = live (executor) ; backtest_* = backtest (--exposure-multiplier CLI surcharge).
  prod_exposure_multiplier: 1.46
  backtest_exposure_multiplier: 1.46
  trailing_stop:
    enabled: false
    mode: dynamic_atr            # fixed | dynamic_atr
    atr_period: 14
    atr_multiplier: 2.5
    fallback_fixed_pct: 5.0
    break_even_after_atr_multiple: 2.0
    eod_check_time_est: "15:50"
    apply_to_manual_orphan_buys: true
  # Time Stop : coupe la position au marché si elle stagne trop longtemps.
  # Exemple cible: 15 à 25 jours ouvrés (valeur recommandée ici: 20).
  time_stop:
    enabled: true
    max_business_days: 20
    min_tp_progress_ratio: 0.50
    near_zero_return_pct: 0.005

  # Force-close sur circuit breaker : liquide les positions les plus
  # perdantes quand le drawdown atteint max_portfolio_drawdown_pct.
  # force_close_on_breaker: true  = active la liquidation
  # force_close_pct: 0.50         = fraction des positions liquidées
  # Force-close sur circuit breaker (PROD vs BACKTEST).
  prod_force_close_on_breaker: true
  prod_force_close_pct: 0.5
  backtest_force_close_on_breaker: true
  backtest_force_close_pct: 0.5
  # legacy fallback :
  # force_close_on_breaker: true
  # force_close_pct: 0.5

  # ── E23 — politique breaker adaptative (2026-08-21) ──
  # "b0" = PROD historique (comportement bit-à-bit inchangé) — ROLLBACK.
  # "b4" = contrôleur robuste (regime rearm + equity confirmation + RELAPSE),
  #        validé backtest + parité logique prod. ACTIF EN PROD depuis le
  #        2026-08-21 (décision GO live). Fail-safe : sans carte régime SPY,
  #        l'allocation est plafonnée à 10%.
  # b1/b2/b3/b4a disponibles. La carte régime SPY journalière PIT est
  # construite automatiquement à partir de stock_bars_daily quand policy != b0.
  policy: b4

  # ── Liquidité dynamique (LiquiditeDynamique.md P1) ──
  # Position max en % de l'ADV 20j du ticker. null = contrainte désactivée.
  # Ex: 0.01 = une position ne peut pas dépasser 1% du volume quotidien du ticker.
  # Pour un compte à $100K avec max_position_weight=10%, la position max est
  # $10K, ce qui représente 0.033% d'un ADV à $30M → contrainte non active.
  # Elle le devient automatiquement si le compte ou le poids augmente.
  max_position_pct_of_adv: null   # 0.01 recommandé pour comptes > $100K

  # Sprint 0 short — feature flag global (cf. plan_v2.md §C8)
  # Active le pipeline long+short. false = long-only (comportement actuel)
  short_selling_enabled: true

  # Sprint 2 — Option C : short via MomentumRotationState
  max_short_positions: 5            # nombre max de shorts simultanés
  short_min_score: 0                # 0 = laisser ML dominer la sélection short
  short_rotation_required: true     # exiger rotation_state.should_rotate()
  short_tp_pct: 0.08                # TP short (8% de baisse)
  short_trailing_pct: 0.10          # trailing stop short (10% de hausse)
  short_time_stop_days: 20          # time stop directionnel

  # ── Modèle de risque factoriel CWMS (Priorité 3 — RisqueSectoriel) ──
  # Décompose le risque en systématique (facteurs communs) vs spécifique.
  # Active les contraintes factorielles + filtre de corrélation implicite.
  enable_factor_model: true
  use_factor_correlation_filter: true    # remplace Pearson par la corrélation implicite
  factor_correlation_threshold: 0.70     # seuil de corrélation implicite max
  max_portfolio_beta: 1.2                # beta moyen pondéré maximum du book
  max_factor_concentration_pct: 0.60     # max 60% du risque venant d'un seul facteur
  min_factor_diversification: 2          # au moins 2 facteurs avec contribution > 10%
  factor_ewma_half_life: 60              # demi-vie EWMA en jours
  factor_lookback_days: 252              # fenêtre d'estimation en jours


# ---------------------------------------------------------------------------
# Screener — Univers personnalisé (optionnel)
# Si `custom_universe_file` pointe vers un fichier existant, le Stock Screener
# (étape 3) utilisera les symboles de ce fichier plutôt que de requêter
# stock_metadata. Le fichier doit contenir des symboles séparés par des virgules.
# Exemple : "config/ticket_mid_cap_400.txt"
# Laissez vide ou commenté pour utiliser l'univers tradable standard.
# ---------------------------------------------------------------------------
screener:
  custom_universe_file: "config/ticket_mid_cap_400.txt"


# ---------------------------------------------------------------------------
# Source primaire des barres OHLCV (`stock_bars` + `stock_bars_daily`).
# Voir prompt/iex/plan_eodhd.md.
# - alpaca : comportement historique (Alpaca/IEX, biais volume IEX).
# - eodhd  : EODHD bulk EOD (volume consolidé proxy, recommandé).
# - Aucun fallback automatique inter-provider n'est implémenté : le switch est
#   explicite via `market_data.bars_provider` (config/IHM). En cas d'échec du
#   provider actif, le run doit échouer ou être relancé après changement
#   opérateur assumé.
# La metadata (stock_metadata), les quotes live et l'exécution restent
# toujours sur Alpaca quel que soit ce flag.
# ---------------------------------------------------------------------------
market_data:
  bars_provider: eodhd   # alpaca | eodhd  (défaut recommandé : eodhd — pilotable depuis IHM › Paramètres)

  # ── Provider quotes live (mode latest) ──
  # `quotes_provider_live` : provider principal pour les snapshots bid/ask temps réel.
  #   Valeurs : 'yahoo' (défaut) | 'alpaca'
  # `quotes_provider_live_second` : provider de secours si le principal échoue
  #   ou ne retourne aucune donnée. Optionnel.
  quotes_provider_live: yahoo
  quotes_provider_live_second: alpaca

eodhd:
  # NB : l'activation runtime se pilote via market_data.bars_provider.
  # Aucun flag `enabled` ici (cf. audit S1 / A-002 : clé fantôme supprimée).
  api_token_env: EODHD_API_TOKEN          # Variable d'env contenant le token.
  exchange: US                            # NYSE + NASDAQ + AMEX consolidés.
  cache_dir: artifacts/eodhd_cache
  daily_quota: 100000                     # Plan All-In-One 19,99 $/mois.
  soft_quota_warn: 80000
  bulk_publish_offset_hours: 2            # Délai post-clôture avant que le bulk soit fiable.
  splits_cache_ttl_days: 7
  circuit_breaker:
    consecutive_failures: 5
    cooldown_minutes: 30

# ---------------------------------------------------------------------------
# Synchronisation calendrier earnings — job planifié (scripts/windows)
# La tâche planifiée Windows exécute automatiquement aux heures listées dans
# `run_hours` :
#   python -u -m dataIntegrityEngine.sync_earnings_calendar
#     --sleep-seconds 1.1 --log-every 25 --batch-size 50
#     --symbol-source active-tradable --resume
# et ajoute une ligne de statut (START / OK / ERROR) dans `log_file`.
# powershell -ExecutionPolicy Bypass -File .\scripts\windows\install_earnings_calendar_task.ps1

# Désinstaller
# powershell -ExecutionPolicy Bypass -File .\scripts\windows\uninstall_earnings_calendar_task.ps1
#  Get-ScheduledTask -TaskName AlphaTrade-EarningsCalendarSync | Select-Object State
#  (Get-ScheduledTask -TaskName AlphaTrade-EarningsCalendarSync).Triggers | Select-Object StartBoundary
# ---------------------------------------------------------------------------
earnings_calendar_sync:
  run_hours: "12,23"                             # Heures de la journée (0-23) séparées par des virgules : "3" = 3h du matin, "4,9" = 4h et 9h.
  log_file: log/batch/earnings_calendar.txt  # Ligne de statut ajoutée à chaque exécution.

# ---------------------------------------------------------------------------
# Collecte prospective Yahoo analyst (RESEARCH ONLY — todo3.txt)
# Historique PIT append-only dans MySQL (estimates/targets/recommendations).
# Aucune intégration PROD. Aucun stockage fichier (MySQL = source de vérité).
# L'univers est la liste FIGÉE ~400 symboles du fichier `symbols_file`
# (config/ticket_mid_cap_400.txt) : explicite, configurable, déterministe,
# jamais recalculé (ni active-tradable 13 608, ni pool Oracle).
# CLI : python scripts/collect_yahoo_analyst_snapshots.py --universe analyst_research --write-db
# powershell -ExecutionPolicy Bypass -File .\scripts\windows\install_analyst_snapshot_task.ps1

# lancer immédiate
# powershell -ExecutionPolicy Bypass -File .\scripts\windows\earnings_calendar_launcher.ps1

# lancer immédiate
# powershell -ExecutionPolicy Bypass -File .\scripts\windows\analyst_snapshot_launcher.ps1
# Désinstaller
# powershell -ExecutionPolicy Bypass -File .\scripts\windows\uninstall_analyst_snapshot_task.ps1
# État de la tâche (Ready / Running / Disabled…)
# Get-ScheduledTask -TaskName AlphaTrade-AnalystSnapshot | Select-Object State
# Déclencheurs (heures planifiées)
# (Get-ScheduledTask -TaskName AlphaTrade-AnalystSnapshot).Triggers | Select-Object StartBoundary
# Détail complet (action, arguments, principal, settings)
# Get-ScheduledTask -TaskName AlphaTrade-AnalystSnapshot | Select-Object -ExpandProperty Actions
# Get-ScheduledTask -TaskName AlphaTrade-AnalystSnapshot | Format-List *
# Via schtasks (vue classique)
# schtasks /query /tn AlphaTrade-AnalystSnapshot /v /fo LIST
# Dernier résultat d'exécution de la tâche
# (Get-ScheduledTaskInfo -TaskName AlphaTrade-AnalystSnapshot) | Select-Object LastRunTime, LastTaskResult
# ---------------------------------------------------------------------------
analyst_snapshot_collection:
  enabled: false                         # RESEARCH ONLY — aucune exécution PROD.
  provider: yahoo
  universe_name: analyst_research        # Nom de l'univers (analyst_research = liste figée).
  symbols_file: config/univers_batch/univers_filtred_tradable.txt
  sleep_seconds: 0.25                    # Throttling entre symboles.
  timeout_seconds: 20                    # Timeout watchdog par symbole.
  max_retries: 2                         # Retries sur TEMPORARY_ERROR / RATE_LIMIT.
  run_hours: "9,23"                        # Heures de la journée (0-23) heure LOCALE machine. Clôture US 16:00 ET = 22:00 heure de Paris (été comme hiver) → "23" = 1h après clôture US. Ajuster à la timezone de la machine si elle n'est pas à Paris.
  log_file: log/batch/analyst_snapshots.txt
  # Planification (après clôture US) : tâche Windows dédiée `AlphaTrade-AnalystSnapshot`
  #   powershell -ExecutionPolicy Bypass -File .\scripts\windows\install_analyst_snapshot_task.ps1
  # qui déclenche `analyst_snapshot_launcher.ps1` aux heures `run_hours` ci-dessus
  # (collecte `--write-db --resume`, append-only PIT, idempotente).

# ---------------------------------------------------------------------------
# Diagnostics batch ML — stockés dans model_batch_diagnostics à la fin de
# chaque campagne d'entraînement.  Consommés par le live et le backtest pour
# filtrer les symboles peu prédictibles ou incapables de shorter/longer.
# ---------------------------------------------------------------------------
batch_diagnostics:
  # Contrat des bundles Oracle Extreme + Per-Symbol LONG/SHORT.
  # strict (défaut production/backtest) : le côté servi doit satisfaire
  # support>=15, >=3 folds, médiane F1 côté>=0.40, min>=0.20 et
  # >=60% des folds avec F1 côté>=0.35.
  # discovery : screening expérimental (médiane>=0.45, min non bloquant).
  # off : désactive uniquement ce gate WF directionnel.
  directional_bundle_gate: strict

  # Nombre de symboles retenus dans le classement top / bottom F1 macro WF.
  top_n: 10
  bottom_n: 10

  # Seuils pour les catégories weak_long / weak_short.
  # Un symbole avec f1_long_wf < weak_long_threshold est marqué `weak_long`.
  # Un symbole avec 0 < f1_short_wf < weak_short_threshold est marqué `weak_short`.
  # Les symboles avec f1_short_wf = 0 sont marqués `zero_short` (indépendamment).
  weak_long_threshold: 0.25
  weak_short_threshold: 0.25

  # Multiplicateur de sizing pour les symboles du top N (rank_type=top).
  # Appliqué dans le live ET le backtest. 1.0 = pas de boost.
  prefer_sizing_multiplier: 1.2

  # Parmi les top_n persistés, combien sont effectivement privilégiés
  # (boost sizing).  Doit être <= top_n.
  # Exemple : top_n=50, prefer_top_n=10 → seuls les 10 meilleurs sont boostés.
  prefer_top_n: 10

  # Batch de diagnostics à utiliser pour le live (étape 11 Risk).
  # Laisser vide (ou absent) pour utiliser automatiquement le dernier batch.
  # Renseigner un batch_id explicite permet de figer les filtres (ex: batch promu).
  live_batch_id: "model-factory-20260811223551-ef2cd0"

  # Horizon de la cascade ML à utiliser en LIVE (colonne global_rank_{H} du
  # filtre TOP/BOTTOM). null/vide = best_horizon du batch (metadata, calculé à
  # l'entraînement) ; valeur explicite = force H (ex: 20 pour geler H20 même si
  # le best_horizon du batch est 10). NE change PAS le sizing stop/TP (maps
  # multi-horizon du risk_management, figées séparément).
  live_horizon:

  # Batch de diagnostics à utiliser pour le backtest.
  # Laisser vide pour utiliser automatiquement le dernier batch (⚠️ look-ahead
  # si le dernier batch est postérieur à la période backtestée).
  # Renseigner un batch_id explicite pour un backtest PIT-safe.
  backtest_batch_id: "model-factory-20260811223551-ef2cd0"

  # Horizon de la cascade ML à utiliser en BACKTEST (même logique que
  # live_horizon). null/vide = best_horizon du batch ; explicite = force H.
  # Gèle H20 pour B25 (le batch stocke best_horizon=10).
  backtest_horizon:

  # Garde-fou « breadth » : part minimale de l'univers de référence
  # (config/ticket_recherche.txt, 400 symboles) requise pour générer les
  # prédictions ML live. 75% × 400 = 300 symboles (borne basse du backtest
  # validé : 311-391). En dessous → prédictions live BLOQUÉES.
  ml_min_universe_pct: 75

  # ── §7.0 (analyse_ml.md) — filtres additionnels par seuils absolus de F1 ──
  # Ces règles complètent le système existant (top/bottom/weak_*).
  # Les symboles exclus par §7 sont ajoutés aux sets exclude_long/exclude_short
  # existants. Mettre `enabled: false` pour désactiver.
  section7:
    enabled: true

    # Seuils de qualité par classe (baseline aléatoire ≈ 0.33)
    long_good_threshold: 0.35          # F1_long minimum pour considérer la direction "bonne"
    short_good_threshold: 0.30         # F1_short minimum pour considérer la direction "bonne"
    long_only_min_threshold: 0.40      # F1_long minimum pour "long only"
    short_only_min_threshold: 0.40     # F1_short minimum pour "short only"
    weak_max_threshold: 0.20           # En dessous = classe "invisible"
    flat_min_threshold: 0.10           # F1_flat minimum (titre pathologique)
    exclude_long_max_threshold: 0.30   # F1_long en dessous → exclure
    exclude_short_max_threshold: 0.30  # F1_short en dessous → exclure


# ---------------------------------------------------------------------------
# Global Ranking Model — inférence du rang percentile pour le stacking.
# Utilisé par l'étape 10 (ML Predict) pour injecter `global_rank` comme feature
# dans les prédictions per-symbol (live et backtest historique).
# ---------------------------------------------------------------------------
global_ranking:
  # Nombre de jours d'historique à charger pour le calcul des features
  # lors de la prédiction du global_rank. 365 = 1 an, suffisant pour
  # momentum_250. Réduire si les barres sont limitées.
  prediction_lookback_days: 365


# ---------------------------------------------------------------------------
# Cascade ML — filtre Global Ranking → Per-Symbol pour le backtest et le live.
# Consommé par modelFactory/predictor.py (cascade_select) et backtesting/.
# Les rangs globaux sont lus depuis alpha_trade.global_rank_history (DB).
# ---------------------------------------------------------------------------
cascade:
  # Activation du filtre cascade dans le backtest et le live.
  # Mettre à false pour désactiver temporairement sans retirer la config.
  enabled: true

  # Seuil de filtrage : ne garder que les top/bottom N% du classement global.
  # 0.20 = top 20% pour LONG, bottom 20% pour SHORT.
  top_pct: 0.10

  # Probabilité minimale du Per-Symbol pour valider un trade.
  # En dessous, le trade est rejeté même si le rang global est bon.
  # Deux seuils distincts : classification (probas 0-1) vs regression (scores continus).
  min_prob_classification: 0.55
  min_prob_regression: 0.10

  # Filtre momentum côté SHORT uniquement (GO production 2026-08-15, dossier
  # logs/analyse_oos.txt sections 19-25 — arbitrage GPT).
  # Le bottom-rank (faiblesse RELATIVE) n'est converti en short que si la
  # faiblesse ABSOLUE est confirmée : mom20 < short_momentum_max_pct.
  # Valeurs : none | loose | strict | confirm | inverted (inverted = placebo).
  # short_momentum_max_pct prioritaire sur le seuil par défaut du mode.
  # NB P4 (2026-08-17) : mis à null pour que le MODE (loose/strict/confirm)
  # détermine seul la règle. Sinon max_pct=2.0 court-circuite confirm/strict
  # (branche `elif short_momentum_max_pct is not None` avant les modes).
  short_momentum_filter: none
  short_momentum_max_pct: null


# ---------------------------------------------------------------------------
# Persistent Rank DIP filter (Global Rank LONG) — composant research validé
# 2026-08-27 (in-sample 2022-24 + OOS 2025 / 2026 H1, jamais négatif).
# Consommé par selector/dip_filter.py, appelé par cascade_select().
# Périmètre STRICT : gate dur sur la branche Global Rank (global_rank_{H})
# uniquement — PAS Oracle Extreme. En Extreme Gate, une activation historique
# est ignorée, sauf `--extreme-gate-dip-saturated` qui utilise N4X2 comme simple
# priorité de classement sans réduire le pool Oracle.
# Règle : global_rank_{H} >= rank_threshold sur `persist_days` séances
#         consécutives ET condition prix close[J]/close[J-N] - 1 selon le SIGNE
#         de dip_pct : >0 = baisse >= X (DIP) ; <0 = hausse >= |X| (anti-DIP).
# Entrée : reclaim_ratio vide/0 = directe (D0, gelé). >0 (ex. 1.0 = retour au
#         prix pré-DIP, 0.99 = 99% de ce prix) = entrée au 1er T (<= max_wait
#         séances) où close[T] >= reclaim_ratio*close[J-N] ET rank >= seuil à T.
# N/X gelés (R50/R100 NO-GO ; reclaim_ratio reste vide par défaut = R off).
# Long only (miroir SHORT futur via une clé *_short dédiée, hors périmètre).
# Clés PROD et BACKTEST DISTINCTES (pattern prod_*/backtest_* de risk_management).
# ---------------------------------------------------------------------------
persistent_dip_filter_long:
  # ---- PROD (live) ----
  prod_enabled: true
  prod_rank_horizon: 20        # 20 → colonne global_rank_20 ; vide = best_horizon du batch
  prod_rank_threshold: 0.90    # = TOP 10%
  prod_persist_days: 4         # N
  prod_dip_pct: 0.02           # X signé : >0 = baisse >= X (DIP) ; <0 = hausse >= |X| (anti-DIP)
  prod_reclaim_ratio: null     # vide = R désactivé (D0 direct) ; 1.0 = retour prix pré-DIP
  prod_reclaim_max_wait: 10    # fenêtre (en séances) pour la confirmation de rebond
  # ---- BACKTEST ----
  backtest_enabled: true
  backtest_rank_horizon: 20
  backtest_rank_threshold: 0.90
  backtest_persist_days: 4
  backtest_dip_pct: 0.02        # X signé : >0 = baisse >= X (DIP) ; <0 = hausse >= |X| (anti-DIP)
  backtest_reclaim_ratio: null # vide = R désactivé (D0 direct)
  backtest_reclaim_max_wait: 10


# ---------------------------------------------------------------------------
# Extreme Gate (composant officiel E6-E13) — Oracle O0 → univers LONG.
# Consommé par modelFactory/predictor.py (cascade_select, rank_mode="extreme_gate")
# et par modelFactory/oracle/extreme_gate.py (compute_extreme_gate).
# Gate = top `pool_pct` par proba_extreme (percentile cross-sectionnel DU JOUR, PIT).
# SÉMANTIQUE : proba_extreme ≠ P(LONG). C'est le potentiel de MOUVEMENT EXTRÊME ;
# l'edge LONG est empirique (univers Extreme, E8-E13). LONG-only, indépendant de B25
# (global_rank_20). La monétisation = m24 (1/24 du budget de risque), lifecycle PROD.
# ---------------------------------------------------------------------------
extreme_gate:
  # Activation de la branche extreme_gate dans cascade_select.
  # false par défaut (baseline production candidate — activer explicitement).
  enabled: false

  # Univers : top `pool_pct` du jour par proba_extreme (percentile >= 1-pool_pct).
  # 0.20 = top 20% (justifié E9/E10 : TOP10 trop arbitraire, tranche 10-20% porteuse).
  pool_pct: 0.20

  # LONG-only : pas de SHORT sur cette branche.
  long_only: true

  # Proba per-symbol minimale (None = défaut cascade min_prob_regression).
  min_prob: null

  # ── Pénalité directionnelle anti-D1 (2026-08-26) ──
  # `proba_extreme` est AGNOSTIQUE à la direction : ~23% des picks top 10%
  # tombent en D1 (bottom 10% réalisé = MAUVAIS long, retour moyen ~-19%).
  # La pénalité dégrade le score des candidats extrême non confirmés LONG
  # (long_prob per-symbol faible) pour réduire l'exposition aux D1.
  #   penalty_enabled          : activer la pénalité
  #   penalty_directional_signal: long_prob (seul supporté actuellement)
  #   penalty_min_directional  : long_prob < seuil → pénalité PROGRESSIVE
  #   penalty_score_floor      : multiplicateur minimum (à signal=0, i.e. le plus
  #                              "D1"). Interpolation linéaire : 1.0 au seuil
  #                              min_directional → floor à signal=reject_below.
  #   penalty_reject_below     : long_prob < seuil → rejet (0 = pas de rejet)
  penalty_enabled: false
  penalty_directional_signal: long_prob
  penalty_min_directional: 0.60
  penalty_score_floor: 0.2
  penalty_reject_below: 0.0


# ---------------------------------------------------------------------------
# Calibration de proba_extreme (Oracle O0) à la consommation cascade/backtest.
# Consommé par backtesting/cli/_impl.py (--oracle-calibration).
#   none     = proba brute (inchangée)
#   rank     = percentile cross-sectionnel intra-date (0..1)
#   isotonic = exige un jeu/artefact de calibration gelé distinct. Le backtest
#              strict PIT ne l'ajuste jamais sur sa propre période.
# NB : la cascade utilise déjà un classement par percentile → la calibration ne
# change PAS la sélection extreme_gate ; elle fiabilise la valeur ABSOLUE de
# proba_extreme (combinaison de signaux, sizing pondéré, seuils absolus).
# ---------------------------------------------------------------------------
oracle:
  calibration: none


# Sprint S8 - Calibration formelle des poids de conviction (cf. core/conviction.py)
conviction:
  # Poids de fusion sentiment (somme = 1.0). Defauts historiques : 0.75 / 0.15 / 0.10.
  quant_weight: 0.75
  sentiment_weight: 0.15
  macro_weight: 0.10

