version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: alpha_trade_test_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: test_alpha_trade
    ports:
      - "3307:3306"  # mapped to 3307 on host to avoid conflicts
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      interval: 10s

volumes:
  mysql_data:

