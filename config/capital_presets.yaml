presets:
- key: capital_0_2000
  label: 0 → 2 000 $ (micro-compte)
  min_equity: 0
  max_equity: 2000
  description: Micro-compte cash (~2 000 EUR / 2 150 USD). Concentration assumée
    (3 lignes), ticket minimum bas, filtres selector relâchés pour ne pas vider
    l'univers, frais de transaction à monter manuellement à 25 bps en backtest pour
    refléter le coût des petits ordres.
  strict_profile_justifications:
    selector_liquidity_threshold: 'Univers micro-compte : 5 M$ suffit pour garder
      quelques dossiers exécutables malgré des tickets plus petits.'
    selector_max_volatility_ratio: Tolérance de volatilité portée à 1.0 pour ne
      pas exclure toute la poche de croissance accessible aux petits tickets.
    selector_min_ibd_rs_rank: RS abaissé à 90 afin de conserver un univers investissable
      malgré la faible taille du compte.
    selector_min_high_52w_proximity: Relâchement volontaire pour accepter des breakouts
      moins mûrs quand l'univers est déjà réduit.
    selector_min_weekly_trend_score: Seuil abaissé sous 1.0 pour éviter un univers
      vide sur micro-compte.
    selector_min_atr_pct_20: ATR minimum abaissé pour laisser entrer des titres encore
      tradables avec petits tickets.
    selector_max_atr_pct_20: Plafond ATR relevé pour tolérer davantage de volatilité
      sur petites/mid caps.
    selector_min_market_cap: Mid caps autorisées à partir de 500 M$ pour élargir
      l'univers accessible.
    selector_min_beta_126: 'Beta minimal abaissé à 0.65 : compromis assumé entre
      qualité et nombre d''opportunités.'
    selector_max_spread_bps: Spreads plus larges acceptés car les petits comptes
      ont moins d'alternatives liquides.
    selector_max_spread_bps_iex: Version IEX alignée sur le relâchement de spread
      pour éviter une exclusion excessive.
    selector_earnings_blackout_days: Fenêtre earnings réduite à 2 jours pour ne
      pas neutraliser trop longtemps un univers déjà étroit.
  values:
    risk_account_equity: __DETECTED_EQUITY__
    risk_per_trade_pct: 0.01
    risk_max_positions: 5
    risk_max_position_weight: 0.35
    risk_max_sector_weight: 0.55
    risk_min_position_notional: 500.0
