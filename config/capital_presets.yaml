presets:
  # ------------------------------------------------------------------
  # Sprint S26 — micro-compte (~2 000 EUR ≈ 2 150 USD)
  # Cible : utilisateur débutant qui démarre avec ~2 000 €.
  # Toutes les valeurs sont en USD (le moteur ne gère pas l'EUR natif).
  # Voir doc/audit/preset_petit_capital_2000eur.md pour la justification.
  # ------------------------------------------------------------------
  - key: capital_0_2000_eur
    label: "0 → 2 000 € (micro-compte)"
    min_equity: 0
    max_equity: 2000
    description: "Micro-compte cash (~2 000 EUR / 2 150 USD). Concentration assumée (3 lignes), ticket minimum bas, filtres selector relâchés pour ne pas vider l'univers, frais de transaction à monter manuellement à 25 bps en backtest pour refléter le coût des petits ordres."
    values:
      risk_account_equity: "__DETECTED_EQUITY__"
      risk_per_trade_pct: 0.01                 # Sprint S1 / A-001 — 1.0 % max sur micro-compte
      risk_max_positions: 3                     # 3 lignes ≈ 600-700 € chacune — A-001 fix
      risk_max_position_weight: 0.35           # 35 % par ligne (concentration assumée)
      risk_max_sector_weight: 0.55             # 1 secteur peut héberger 2 lignes /3
      risk_min_position_notional: 500.0        # ticket mini USD (sinon frais > alpha) — A-001 fix
      # Monotonie respectée : DD plus strict que les tranches supérieures
      # (ordre attendu par tests/test_capital_preset_risk_overrides.py).
      risk_max_drawdown_pct: 0.07
      risk_max_daily_loss_pct: 0.025
      risk_target_annual_vol: 0.12
      risk_vol_target_lookback_days: 60
      risk_min_ml_coverage_ratio: 0.80
      risk_correlation_threshold: 0.92
      risk_correlation_lookback_days: 40
      risk_correlation_min_overlap: 25
      risk_enable_kelly: false
      risk_score_weight: 0.45
      risk_prediction_weight: 0.55
      execution_account_type: cash             # PDT rule désactivable car cash
      execution_pdt_rule: "off"               # PDT N/A sur compte cash (règle margin only — cf. execution_engine/config.py:effective_pdt_rule)
      execution_swing_only: true               # interdit toute logique day-trade
      execution_cash_settlement_days: 1
      execution_submission_window: both
      execution_trailing_trigger: multiple_r
      execution_trailing_r_multiple: 1.0
      backtesting_commission_bps_stress: 15.0
      backtesting_slippage_bps_stress: 25.0
      backtesting_max_portfolio_dd_pct: 0.12
      backtesting_target_annual_vol: 0.12
      backtesting_min_ml_coverage_ratio: 0.80
      screener_liquidity_threshold_usd: 2000000.0   # relâché vs 5M$ pour 0_5000
      screener_min_relative_strength_index: 90.0
      screener_historical_range_lookback_days: 252
      screener_min_historical_range_score: 55.0
      screener_first_pass_window_days: 252
      selector_selection_size: 15
      selector_sector_cap_ratio: 0.55
      selector_liquidity_threshold: 5000000.0
      selector_min_close: 10.0                 # min 10$ : limite l'impact des frais fixes
      selector_max_volatility_ratio: 1.0
      selector_min_ibd_rs_rank: 90.0           # Sprint S1 / A-028 — nouveau nom explicite
      selector_min_relative_strength_index: 90.0  # alias rétrocompatible 1 release
      selector_min_high_52w_proximity: 0.55
      selector_min_weekly_trend_score: 0.65
      selector_min_atr_pct_20: 0.01
      selector_max_atr_pct_20: 0.09            # tolère un peu plus de vol pour micro-cap
      selector_min_market_cap: 500000000.0     # mid-cap accessibles (vs 1Md$ pour 0_5000)
      selector_min_beta_126: 0.65
      selector_max_spread_bps: 80.0            # spreads plus larges acceptés
      selector_max_spread_bps_iex: 100.0       # relâchement IEX >= max_spread_bps
      selector_earnings_blackout_days: 2
      selector_max_anomaly_count: 15
      selector_require_above_ma200: true

