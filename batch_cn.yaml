schema_version: 2
defaults:
  database_alias: cn_primary
  provider: baostock
  timezone: Asia/Shanghai
  scheduler_timezone: Europe/Paris
  canonical_writes_enabled: false

# Sprint 17-B : sauvegarde CN physiquement isolée. Restauration complète
# vérifiée le 30/09/2026 (21 tables, 57 188 133 lignes, base temporaire nettoyée).
cn_db_backup:
  enabled: true
  status: ACTIVE
  priority: P0
  market_code: CN_A
  database_alias: cn_primary
  timezone: Europe/Paris
  run_hours: "4"
  run_minutes: "0"
  run_days: "0"
  description: "Sauvegarde hebdomadaire isolée de alpha_trade_cn, jamais de alpha_trade."
  provider: local_mysql
  host: localhost
  db: alpha_trade_cn
  mysqldump_path: "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
  dest_dir: backups/cn/db
  archive_prefix: alpha_trade_cn
  keep: 3
  output_root: artifacts/research/cn_backup_17b
  log_file: log/batch_cn/cn_db_backup.txt

cn_master_calendar_sync:
  enabled: false
  priority: P0
  market_code: CN_A
  description: "Référentiel actions Shanghai/Shenzhen et calendrier de cotation via BaoStock gratuit."
  endpoints: [stock_basic, trade_cal]
  start_date: 2010-01-01
  run_hours: "11"
  run_days: "0"
  state_key: cn_master_calendar_sync
  log_file: log/batch_cn/cn_master_calendar_sync.txt

cn_daily_market_data_sync:
  enabled: false
  status: DISABLED_DUPLICATE_D9
  priority: P0
  market_code: CN_A
  description: "OHLCV quotidien non ajusté, statuts de négociation/ST, facteurs d'ajustement et indices via BaoStock."
  endpoints: [daily, adj_factor, index_daily]
  lookback_days: 10
  include_inactive: false
  run_hours: "10"
  run_days: "1,2,3,4,5"
  state_key: cn_daily_market_data_sync
  execution_notice: "Ne pas activer : D9 est propriétaire unique des écritures canoniques quotidiennes CN. Ce collecteur générique ne publie pas l'Oracle et son lookback ne permet pas de reconstituer une décision PIT manquée."
  log_file: log/batch_cn/cn_daily_market_data_sync.txt

cn_historical_backfill:
  enabled: false
  priority: P0
  market_code: CN_A
  description: "Backfill BaoStock reprenable depuis 2010 ; lancement manuel uniquement."
  endpoints: [stock_basic, trade_cal, daily, adj_factor, index_daily]
  start_date: 2010-01-01
  end_date: null
  include_inactive: true
  state_key: cn_historical_backfill
  log_file: log/batch_cn/cn_historical_backfill.txt

cn_baostock_smoke:
  enabled: false
  priority: P0
  market_code: CN_A
  description: "Smoke réel borné BaoStock, sans clé, avant activation des batchs récurrents."
  endpoints: [stock_basic, trade_cal, daily, adj_factor, index_daily]
  start_date: 2025-01-02
  end_date: 2025-01-10
  max_symbols: 5
  log_file: log/batch_cn/cn_baostock_smoke.txt

cn_staging_quality_daily:
  enabled: false
  status: SUPERSEDED_BY_17C
  priority: P0
  market_code: CN_A
  provider: quality
  description: "Contrôle de couverture, fraîcheur, doublons et lineage du staging CN ; aucune collecte."
  endpoints: [stock_basic, trade_cal, daily, adj_factor, index_daily]
  min_daily_rows: 1
  max_age_days: 5
  run_hours: "12"
  run_days: "1,2,3,4,5"
  execution_notice: "Contrôle staging historique désactivé : l'âge en jours calendaires peut alerter à tort pendant les congés CN et ne vérifie ni D9 ni Oracle/D6/D10. Utiliser cn_daily_quality_17c."
  log_file: log/batch_cn/cn_staging_quality_daily.txt

# Sprint 17-C : lecture seule après D9, sans second collecteur ou reconstruction PIT.
cn_daily_quality_17c:
  enabled: true
  status: ACTIVE
  priority: P0
  market_code: CN_A
  database_alias: cn_primary
  timezone: China Standard Time
  run_hours: "23"
  run_minutes: "30"
  run_days: "1,2,3,4,5"
  description: "Contrôler chaque séance ouverte CN après la fenêtre de collecte D9 : lots, barres, facteurs, limites, Oracle, snapshots D6 et appariement D10. Aucune collecte."
  provider: local_quality
  tables: "lecture seule:market_sessions,cn_staging_rows,stock_bars_daily,instrument_adjustment_factors,cn_daily_price_limits; fichiers:D6/D9/D10"
  universe_scope: cn_a_all_equities_pit
  calendar: config/research_cn/sprint15d6_cn_calendar_2026.yaml
  d6_snapshot_root: artifacts/research/cn_dragon_tiger_15d6/observations
  d10_output_root: artifacts/research/cn_dragon_tiger_15d10
  output_root: artifacts/research/cn_daily_quality_17c
  minimum_bar_coverage_ratio: 0.995
  coverage_description: "Séance CN ouverte J à 19:30 Shanghai ; contrôle de complétude D9 et des artefacts de recherche, sans reconstitution d'une prévision manquée. Jours fermés SKIP."
  execution_notice: "D9 est le seul propriétaire de la collecte canonique. Les échecs critiques sont bloquants pour le gate opérationnel ; 7 séances ouvertes consécutives sans anomalie critique inexpliquée sont requises. Pas de serving ni d'ordres."
  supervision_dependencies: cn_oracle_prospective_daily,cn_dragon_tiger_after_close,cn_dragon_tiger_before_open,cn_dragon_tiger_daily_match
  log_file: log/batch_cn/cn_daily_quality_17c.txt

cn_akshare_enrichment:
  enabled: false
  priority: P2
  market_code: CN_A
  provider: akshare
  description: "Réservé aux enrichissements gratuits non bloquants après validation de chaque endpoint et de sa stabilité."
  endpoints: []
  activation_blocker: "Aucun endpoint AKShare ne devient canonique sans smoke réseau, contrat PIT et test de schéma."
  log_file: log/batch_cn/cn_akshare_enrichment.txt

cn_tushare_optional:
  enabled: false
  priority: P3
  market_code: CN_A
  provider: tushare
  token_env: TUSHARE_TOKEN
  description: "Connecteur conservé pour un futur essai ; jamais requis par le chemin gratuit."
  endpoints: [stock_basic, namechange, trade_cal, daily, adj_factor, suspend_d, stk_limit, index_daily]
  lookback_days: 7
  state_key: cn_tushare_optional
  log_file: log/batch_cn/cn_tushare_optional.txt
