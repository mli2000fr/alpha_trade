name: Nightly Parity (Sprint S11 / S11.2)

# Cron 06:00 UTC du lundi au vendredi (après clôture US la veille).
# Lance le harness de parité live ↔ replay et archive le rapport 365 jours.
on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Date de trade à analyser (YYYY-MM-DD). Défaut : J-1."
        required: false
        default: ""

jobs:
  parity:
    name: Daily parity (live vs replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LOGIN_DB: ${{ secrets.PARITY_DB_USER }}
      PASSWORD_DB: ${{ secrets.PARITY_DB_PASSWORD }}
      DB_HOST: ${{ secrets.PARITY_DB_HOST }}
      ALPACA_API_KEY: ${{ secrets.PARITY_ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.PARITY_ALPACA_SECRET_KEY }}
      ALPHA_TRADE_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Compute trade date
        id: dates
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            echo "trade_date=${{ github.event.inputs.trade_date }}" >> $GITHUB_OUTPUT
          else
            echo "trade_date=$(date -u -d 'yesterday' +%F)" >> $GITHUB_OUTPUT
          fi

      - name: Run daily parity
        id: parity
        shell: bash
        continue-on-error: true
        run: |
          python -m scripts.run_daily_parity \
            --trade-date "${{ steps.dates.outputs.trade_date }}" \
            --account default
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload parity artifacts (rétention 365 j)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ steps.dates.outputs.trade_date }}
          path: artifacts/parity_runs/**
          retention-days: 365
          if-no-files-found: warn

      - name: Notify Slack on failure
        if: steps.parity.outcome == 'failure' && env.ALPHA_TRADE_SLACK_WEBHOOK != ''
        shell: bash
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Nightly parity FAILED for ${{ steps.dates.outputs.trade_date }} — voir https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$ALPHA_TRADE_SLACK_WEBHOOK"

      - name: Fail job if parity exited non-zero
        if: steps.parity.outcome == 'failure'
        run: |
          echo "Daily parity returned non-zero exit code." >&2
          exit 1

