name: formal_verification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "formal/**"
      - "corporate_actions/models.py"
      - "execution_engine/**"
  workflow_dispatch:

jobs:
  z3-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install z3-solver
          pip install -e ".[dev]"
      - name: Run Z3 proofs
        run: python scripts/run_formal_verification.py
      - name: Run tests/formal
        run: pytest tests/formal -v --no-cov
      - name: Upload proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-proofs-${{ github.run_id }}
          path: artifacts/formal_runs

