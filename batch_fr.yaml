fr_fundamentals_sync:
  enabled: false # Suspension de prudence : accès API autorisé, gestion des retraits/archives à compléter.
  status: BLOCKED_INPI_RETENTION
  priority: P2
  provider: INPI
  collection_mode: quarantine_only
  issuer_manifest: artifacts/fr/operations/fr_fundamentals_sync/mapping/verified_manifest.json
  mapping_report_file: artifacts/fr/operations/fr_fundamentals_sync/mapping/mapping_report.json
  max_requests_per_run: 500
  max_requests_per_day: 5000 # Plafond local UTC ; quota INPI documenté 10000 API/IHM par utilisateur/jour, autres usages à déduire.
  max_issuers_per_run: 25
  refresh_days: 7
  request_interval_seconds: 0.25
  max_archive_bytes_per_run: 134217728 # 128 Mio ; arrêt explicite, pas promotion partielle.
  username_env: INPI_USERNAME
  password_env: INPI_PASSWORD
  run_hours: "20"
  description: "Collecte sécurisée INPI étendue à toutes les identités FR S6C correctement reliées à un SIREN ; ambiguïtés exclues, archives en quarantaine, reprise et quotas."
  tables: "fr_batch_research_documents,fr_batch_research_file_versions"
  universe_scope: "330 identités FR S6C recherchées ; seules correspondances ISIN/LEI/SIREN vérifiées sont collectées. Étrangers, ambiguïtés et validations insuffisantes exclus avec motifs."
  coverage_description: "Lots de 25 émetteurs au plus, pagination et documents repris au checkpoint ; jusqu'à 500 appels/run et 5000/jour UTC, revue des documents tous les 7 jours. Pas de reconstruction PIT historique."
  activation_requirement: "SUSPENDU PAR PRUDENCE : l'accès INPI aux comptes publics est autorisé, mais le traitement des documents ultérieurement retirés et de leurs copies archivées/sauvegardées n'est pas complet. Qualifier les obligations du compte et implémenter/valider cette gestion avant réactivation. Voir doc/fr/audit_autorisations_collectes_20261006.md."
  unlock_steps: ["Confirmer la licence applicable au compte et les obligations de conservation/retrait", "Détecter les documents supprimés ou devenus non publics, traiter les copies précédemment archivées et les index", "Définir et tester le traitement des sauvegardes et des restaurations pour éviter la réapparition des contenus retirés", "Documenter la validation puis lever le statut bloqué et enabled=false ; la promotion ML reste séparée"]
  research_notice: >-
    **BATCH SUSPENDU PAR PRUDENCE — GESTION DES RETRAITS INPI À COMPLÉTER.**
    L'accès officiel n'est pas déclaré interdit ; la réserve porte sur la conservation des documents retirés,
    y compris leurs copies dans les sauvegardes. Ne pas réactiver avant validation de cette gestion.
    **COLLECTE UNIQUEMENT — COMPTES EN QUARANTAINE. NON UTILISABLES PAR LE ML, LES BACKTESTS OU LE LIVE.**
    Mapping recherché sur tout l'univers FR S6C, pas sur tous les titres Euronext.
    Seuls les SIREN vérifiés sont collectés ; les exclus et leurs motifs sont affichés ci-dessous.
    Collecte répartie avec reprise : un passage réussi ne signifie pas que tout l'univers a été terminé.
    **AVANT UTILISATION :** qualifier identité ISIN/SIREN, unité/échelle, devise, exercice fiscal,
    comptes sociaux ou consolidés, versions/retraits et disponibilité PIT.
    Les nouveaux comptes devront subir les contrôles automatiques correspondants ; les cas ambigus restent exclus.
    Une clôture ou un dépôt ancien ne prouve pas que le contenu collecté aujourd'hui était disponible historiquement.
    À chaque décision, n'utiliser que les données effectivement disponibles avant son heure.
    Tester les features qualifiées hors échantillon contre une baseline sans fondamentaux INPI avant toute promotion,
    puis réévaluer périodiquement ou après changement important, pas à chaque collecte.
    Mapping et reçus existants archivés en SQL de recherche ; aucune nouvelle collecte ni alimentation des features.
    La gestion des retraits devra également couvrir ces copies SQL. Voir doc/fr/inpi_univers_collecte_securisee.md.
    Archivage renforcé : comptes publics complets, horodatages, preuves de mapping par passage,
    pages de références et motifs d'exclusion conservés. PDFs/annexes non collectés ; contenus confidentiels/retirés non archivés.
    La sauvegarde fr_artifacts_backup inclut ces fichiers via artifacts/fr.
  log_file: log/batch_fr/fr_fundamentals_sync.txt

fr_consensus_snapshot:
  enabled: true # Activation EODHD demandée par l'utilisateur le 15/10/2026 ; aucun fallback Yahoo.
  status: ACTIVE_RESEARCH
  priority: P3
  provider: eodhd
  run_hours: "20"
  run_days: "0,1,2,3,4,5,6" # Snapshots courants, également utiles le week-end.
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  universe_mode: all_verified_active
  pilot_symbols: [OR.PA, SU.PA, BN.PA]
  max_symbols_per_run: 400
  max_endpoint_calls_per_day: 400 # Une requête Trends par titre, compteur réservé avant appel ; quota global EODHD également respecté.
  request_interval_seconds: 1.1
  description: "Consensus EPS/revenus, tendances EPS et compteurs de révisions EODHD sur l'univers FR S6C actif vérifié. Historique prospectif de recherche isolé de l'US et de Yahoo."
  tables: "alpha_trade_fr.eodhd_consensus_raw_payloads,alpha_trade_fr.stock_analyst_consensus_eodhd_history"
  universe_scope: "Référentiel FR S6C courant actif et vérifié, marchés Paris XPAR/ALXP/XMLI ; ambiguïtés ISIN/symbole exclues. Pas tous les titres Euronext."
  coverage_description: "Snapshot réellement observé à J, reprise des titres incomplets du jour ; les succès ne sont pas rechargés le même jour. Pas de reconstruction J-7/J."
  research_notice: >-
    **SOURCE EODHD — YAHOO RESTE BLOQUÉ, AUCUN FALLBACK YAHOO.**
    Accès /calendar/trends confirmé avec l'abonnement existant sur OR.PA, SU.PA, BN.PA et AI.PA.
    EPS/revenus (moyenne, bornes, analystes), tendances EPS J-7/30/60/90 et compteurs de révisions disponibles.
    Pas d'objectifs de cours ni de recommandations achat/conserver/vendre dans cette collecte.
    Tables dédiées dans alpha_trade_fr ; aucune écriture dans alpha_trade ou les tables Yahoo.
    Réponses brutes complètes et observations UTC réelles, première normalisation quotidienne conservée.
    Les anciennes dates fiscales renvoyées aujourd'hui ne constituent PAS des snapshots PIT anciens.
    Absence normale de consensus distinguée d'un échec technique ; pas de seuil arbitraire de 95 % sur cet univers FR.
    **RECHERCHE EN QUARANTAINE :** identités fiscales, devise, unité, exercice et disponibilité à qualifier avant ML/backtest/live.
    Devise absente = NULL, jamais EUR inventé. Aucun signal D1/D10 ni ordre automatique.
    Construire les révisions entre snapshots comparables réellement observés ; ne pas confondre un changement d'exercice avec une révision.
    Notifications email/Telegram par le launcher FR commun. Archives SQL incluses dans fr_db_backup, fichiers dans fr_artifacts_backup.
    Voir doc/fr/consensus_eodhd_collecte_quotidienne.md.
  activation_requirement: "Source EODHD activée sur demande utilisateur ; accès FR et deux tables de recherche vérifiés. Installer/réinstaller la tâche depuis l'IHM ; aucune permission Yahoo supposée, pas de redistribution."
  unlock_steps: ["Vérifier le schéma EODHD dans alpha_trade_fr et le smoke", "Installer/réinstaller la tâche FR", "Qualifier séparément devises/unités/exercices et révisions avant ML/backtest"]
  log_file: log/batch_fr/fr_consensus_snapshot.txt

