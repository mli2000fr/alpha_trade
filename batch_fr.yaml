schema_version: 1
defaults:
  market_code: FR_EQ
  database_alias: fr_primary
  timezone: Europe/Paris
  scheduler_timezone: Europe/Paris
  calendar: XPAR
  canonical_writes_enabled: false
  serving_enabled: false
  enabled: false
  status: PENDING_QUALIFICATION
  run_minutes: "0"
  run_days: "1,2,3,4,5"
  lookback_days: 7
  license: source_specific_review_required

fr_calendar_snapshot:
  enabled: true
  status: ACTIVE_RESEARCH
  priority: P0
  provider: local_XPAR_calendar
  run_hours: "7"
  run_days: "0"
  days_ahead: 370
  description: "Archiver le calendrier XPAR utilisé par la recherche, avec source et horaires UTC. Pas une preuve officielle ni une écriture de market_sessions."
  tables: "aucune; fichiers:artifacts/fr/operations/calendar"
  coverage_description: "J-7 à J+370, calendrier de bibliothèque XPAR ; relance idempotente par date d'observation."
  research_notice: "Calendrier de bibliothèque, pas validation des exceptions officielles Euronext."
  log_file: log/batch_fr/fr_calendar_snapshot.txt

fr_security_master_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  priority: P0
  provider: ESMA_Euronext
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  baseline_history: artifacts/fr/esma_firds/replay_2018/history_2026_observed_v2.json
  max_catchup_days: 31
  max_archive_requests: 128
  run_hours: "20"
  description: "Observer les changements ESMA ISIN/MIC des 330 identités S6C ; fichiers versionnés, sans mise à jour canonique ni nouveaux tickers automatiques."
  tables: "aucune SQL; fichiers:artifacts/fr/operations/fr_security_master_sync"
  activation_requirement: "Deux passages réels validés le 05/10/2026 : 9/9 archives, zéro doublon de version, checkpoint au 04/10. Pas de promotion SQL ni de réparation des lacunes historiques."
  coverage_description: "Publications ESMA jusqu'à J-1 ; recouvrement 7 jours, rattrapage borné à 31 jours. Fragments absents : checkpoint non avancé."
  research_notice: "330 ISIN S6C figés ; pas découverte de tous les nouveaux émetteurs, pas remplacement automatique des alias EODHD. available_at des nouvelles versions = observation réelle, pas date rétroactive. Historique antérieur conserve ses lacunes."
  unlock_steps: ["Installer la tâche FR depuis la page Batch", "Surveiller les fragments ESMA et la continuité récente", "Qualifier séparément découverte nouveaux titres et promotion SQL"]
  log_file: log/batch_fr/fr_security_master_sync.txt

fr_daily_bars_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  priority: P0
  provider: EODHD
  run_hours: "22"
  universe_scope: "config/universe_fr_s6c.yaml (contrat FR, pas fichier univers US)"
  description: "Collecter J-7/J des OHLCV FR et leurs corrections dans un staging versionné, puis publier uniquement les données qualifiées."
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  request_interval_seconds: 0.5
  max_symbol_requests: 400 # 294 titres actifs du référentiel S6C actuel ; stop si budget dépassé.
  after_close_hour_paris: 22
  tables: "aucune SQL; fichiers:artifacts/fr/operations/eodhd_daily (raw,latest,windows)"
  coverage_description: "J-7/J après 22h Paris ; avant 22h : J-7/J-1. Reprise explicite, relance normale rafraîchissant les corrections."
  research_notice: "Collecte fournisseur fichiers uniquement ; univers S6C figé (statut actif actuel), pas référentiel quotidien ni preuve tradable/PIT historique. Aucun SQL canonique."
  activation_requirement: "Smoke réel de deux passages validé sur 3 titres ; surveillance pleine couverture et publication staging SQL restent à qualifier."
  unlock_steps: ["Valider deux collectes réelles sur petit sous-ensemble", "Contrôler quota et corrections", "Qualifier publication staging SQL séparément ; aucune promotion canonique automatique"]
  log_file: log/batch_fr/fr_daily_bars_sync.txt

fr_corporate_actions_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  request_interval_seconds: 0.5
  max_symbol_requests: 400
  priority: P0
  provider: EODHD_public_evidence
  run_hours: "23"
  description: "Dividendes/splits et corrections fournisseur, preuves publiques et dates de disponibilité ; inconnus explicites."
  tables: "aucune SQL; fichiers versionnés:artifacts/fr/operations/fr_corporate_actions_sync"
  coverage_description: "J-7/J fournisseur, dividendes et splits ; deux requêtes par titre, aucune action connue est une réponse vide valide."
  activation_requirement: "Collecte fichiers validée sur 3 titres/deux passages ; validation cash/actions/paiement et publication SQL restent ouvertes."
  research_notice: "Dates et valeurs fournisseur non promues comme preuves officielles ; normalisation canonique et contrôle complet des 294 titres à qualifier."
  log_file: log/batch_fr/fr_corporate_actions_sync.txt

fr_pit_quality_daily:
  enabled: true
  status: ACTIVE_RESEARCH
  collection_dependencies: [fr_daily_bars_sync, fr_corporate_actions_sync, fr_amf_short_sync, fr_dila_disclosures_sync]
  max_run_age_hours: 96 # Inclut un week-end ; fraîcheur des runs, pas certification PIT des tables.
  priority: P0
  provider: local_quality
  run_hours: "6"
  description: "Superviser le dernier run des quatre collectes FR : succès, ancienneté et exclusion des smokes limités. Aucune nouvelle donnée marché, pas certification PIT des tables."
  tables: "aucune SQL; lecture des rapports locaux FR et fichiers:artifacts/fr/operations/quality"
  activation_requirement: "Contrôle opérationnel implémenté ; échoue tant que les quatre collectes complètes ne disposent pas de runs récents réussis."
  supervision_dependencies: fr_daily_bars_sync,fr_corporate_actions_sync,fr_amf_short_sync,fr_dila_disclosures_sync
  research_notice: "Ce contrôle n'évalue pas encore le référentiel, la fraîcheur des barres individuelles, les doublons SQL ou la validité économique/PIT. Il n'inclut pas ses propres échecs."
  log_file: log/batch_fr/fr_pit_quality_daily.txt

fr_amf_short_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  priority: P1
  provider: AMF_public
  run_hours: "21"
  description: "Positions courtes publiques AMF : versions, seuils de publication et available_at prudent. Pas le short interest complet."
  tables: "aucune SQL; fichiers versionnés:artifacts/fr/operations/fr_amf_short_sync"
  coverage_description: "Snapshot de l'export AMF complet courant ; historique reconstruit, pas vintage historique."
  activation_requirement: "Deux passages réels validés ; intégration SQL et features directionnelles non autorisées."
  research_notice: "Licence Ouverte 2.0, positions publiques censurées par seuil ; absence n'est pas zéro. Lignes historiques incohérentes conservées en quarantaine."
  log_file: log/batch_fr/fr_amf_short_sync.txt

fr_dila_disclosures_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  priority: P1
  provider: DILA_INFO_FINANCIERE
  run_hours: "21"
  run_minutes: "30"
  description: "Annonces et pièces publiques, hashes, publication/observation PIT, quota et erreurs de téléchargement visibles."
  tables: "aucune SQL; fichiers versionnés:artifacts/fr/operations/fr_dila_disclosures_sync"
  coverage_description: "J-7/J sur la date de transmission AMF ; métadonnées pour les ISIN vérifiés, versions conservées."
  activation_requirement: "Deux passages réels validés ; extraction des documents et revue indépendante des paires guidance restent ouvertes."
  research_notice: "Métadonnées uniquement, pas téléchargement des PDF ni signal directionnel. Horodatages invalides en quarantaine ; available_at est l'observation effective."
  log_file: log/batch_fr/fr_dila_disclosures_sync.txt

fr_fundamentals_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  priority: P2
  provider: INPI
  collection_mode: quarantine_only
  issuer_manifest: artifacts/fr/operations/fr_fundamentals_sync/mapping/verified_manifest.json
  mapping_report_file: artifacts/fr/operations/fr_fundamentals_sync/mapping/mapping_report.json
  max_requests_per_run: 500
  max_requests_per_day: 5000 # Plafond local UTC ; quota INPI documenté 10000 API/IHM par utilisateur/jour, autres usages à déduire.
  max_issuers_per_run: 25
  refresh_days: 7
  request_interval_seconds: 0.25
  max_archive_bytes_per_run: 134217728 # 128 Mio ; arrêt explicite, pas promotion partielle.
  username_env: INPI_USERNAME
  password_env: INPI_PASSWORD
  run_hours: "20"
  description: "Collecte sécurisée INPI étendue à toutes les identités FR S6C correctement reliées à un SIREN ; ambiguïtés exclues, archives en quarantaine, reprise et quotas."
  tables: "aucune SQL; fichiers:artifacts/fr/operations/fr_fundamentals_sync/quarantine et observations"
  universe_scope: "330 identités FR S6C recherchées ; seules correspondances ISIN/LEI/SIREN vérifiées sont collectées. Étrangers, ambiguïtés et validations insuffisantes exclus avec motifs."
  coverage_description: "Lots de 25 émetteurs au plus, pagination et documents repris au checkpoint ; jusqu'à 500 appels/run et 5000/jour UTC, revue des documents tous les 7 jours. Pas de reconstruction PIT historique."
  activation_requirement: "Mapping étendu aux 330 identités S6C, exclusions motivées ; seuls les SIREN vérifiés sont collectés par lots. Promotion des fondamentaux bloquée tant que unités, exercices, versions/retraits et dates PIT ne sont pas qualifiés. Voir doc/fr/inpi_univers_collecte_securisee.md."
  unlock_steps: ["Accès et pilote dix émetteurs réalisés : conserver les secrets hors YAML", "Arbitrer les incohérences Danone/L'Oréal, l'échelle Schneider et les versions BIC", "Qualifier unités, cellules consolidées, retraits et dates PIT ; ne pas corriger automatiquement", "Implémenter/valider stockage, reprise, idempotence et notifications avant activation"]
  research_notice: "**COLLECTE UNIQUEMENT — COMPTES EN QUARANTAINE. NON UTILISABLES PAR LE ML, LES BACKTESTS OU LE LIVE.** Mapping recherché sur tout l'univers FR S6C, pas sur tous les titres Euronext. Seuls les SIREN vérifiés sont collectés ; les exclus et leurs motifs sont affichés ci-dessous. Collecte répartie avec reprise : un passage réussi ne signifie pas que tout l'univers a été terminé. Aucune écriture SQL, aucune alimentation des features."
  log_file: log/batch_fr/fr_fundamentals_sync.txt

fr_consensus_borrow_options:
  priority: P3
  provider: unqualified
  run_hours: "20"
  description: "Réserve pour consensus, emprunt, enchères et options France ; aucune source quotidienne qualifiée."
  activation_requirement: "Fournisseur, licence, coût, PIT et contrat de schéma manquants."
  log_file: log/batch_fr/fr_consensus_borrow_options.txt

fr_db_backup:
  enabled: true
  status: ACTIVE
  priority: P0
  provider: local_mysql
  run_hours: "3"
  run_days: "0"
  db: alpha_trade_fr
  dest_dir: backups/fr/db
  archive_prefix: alpha_trade_fr
  keep: 3
  mysqldump_path: "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
  description: "Sauvegarde isolée de alpha_trade_fr, schéma/routines/triggers ; activation après preuve de restauration."
  activation_requirement: "Dump et restauration réelle vérifiés le 05/10/2026 : 28 tables, schéma/index/routines/triggers et nombres de lignes identiques. Installation Windows reste à effectuer depuis l'IHM."
  qualification_report: backups/fr/qualification/20261005T191341-42dd10c5/report.json
  coverage_description: "Sauvegarde complète alpha_trade_fr ; dimanche 03:00 Paris, keep configurable."
  log_file: log/batch_fr/fr_db_backup.txt

