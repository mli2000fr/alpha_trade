  coverage_description: "Snapshot de l'export AMF complet courant ; historique reconstruit, pas vintage historique."
  activation_requirement: "Deux passages réels validés ; intégration SQL et features directionnelles non autorisées."
  research_notice: "Licence Ouverte 2.0, positions publiques censurées par seuil ; absence n'est pas zéro. Lignes historiques incohérentes conservées en quarantaine."
  log_file: log/batch_fr/fr_amf_short_sync.txt

fr_dila_disclosures_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  priority: P1
  provider: DILA_INFO_FINANCIERE
  run_hours: "21"
  run_minutes: "30"
  description: "Annonces et pièces publiques, hashes, publication/observation PIT, quota et erreurs de téléchargement visibles."
  tables: "aucune SQL; fichiers versionnés:artifacts/fr/operations/fr_dila_disclosures_sync"
  coverage_description: "J-7/J sur la date de transmission AMF ; métadonnées pour les ISIN vérifiés, versions conservées."
  activation_requirement: "Deux passages réels validés ; extraction des documents et revue indépendante des paires guidance restent ouvertes."
  research_notice: "Métadonnées uniquement, pas téléchargement des PDF ni signal directionnel. Horodatages invalides en quarantaine ; available_at est l'observation effective."
  log_file: log/batch_fr/fr_dila_disclosures_sync.txt

fr_fundamentals_sync:
  enabled: true
  status: ACTIVE_RESEARCH
  priority: P2
  provider: INPI
  collection_mode: quarantine_only
  issuer_manifest: artifacts/fr/operations/fr_fundamentals_sync/mapping/verified_manifest.json
  mapping_report_file: artifacts/fr/operations/fr_fundamentals_sync/mapping/mapping_report.json
  max_requests_per_run: 500
  max_requests_per_day: 5000 # Plafond local UTC ; quota INPI documenté 10000 API/IHM par utilisateur/jour, autres usages à déduire.
  max_issuers_per_run: 25
  refresh_days: 7
  request_interval_seconds: 0.25
  max_archive_bytes_per_run: 134217728 # 128 Mio ; arrêt explicite, pas promotion partielle.
  username_env: INPI_USERNAME
  password_env: INPI_PASSWORD
  run_hours: "20"
  description: "Collecte sécurisée INPI étendue à toutes les identités FR S6C correctement reliées à un SIREN ; ambiguïtés exclues, archives en quarantaine, reprise et quotas."
  tables: "aucune SQL; fichiers:artifacts/fr/operations/fr_fundamentals_sync/quarantine et observations"
  universe_scope: "330 identités FR S6C recherchées ; seules correspondances ISIN/LEI/SIREN vérifiées sont collectées. Étrangers, ambiguïtés et validations insuffisantes exclus avec motifs."
  coverage_description: "Lots de 25 émetteurs au plus, pagination et documents repris au checkpoint ; jusqu'à 500 appels/run et 5000/jour UTC, revue des documents tous les 7 jours. Pas de reconstruction PIT historique."
  activation_requirement: "Mapping étendu aux 330 identités S6C, exclusions motivées ; seuls les SIREN vérifiés sont collectés par lots. Promotion des fondamentaux bloquée tant que unités, exercices, versions/retraits et dates PIT ne sont pas qualifiés. Voir doc/fr/inpi_univers_collecte_securisee.md."
  unlock_steps: ["Accès et pilote dix émetteurs réalisés : conserver les secrets hors YAML", "Arbitrer les incohérences Danone/L'Oréal, l'échelle Schneider et les versions BIC", "Qualifier unités, cellules consolidées, retraits et dates PIT ; ne pas corriger automatiquement", "Implémenter/valider stockage, reprise, idempotence et notifications avant activation"]
  research_notice: >-
    **COLLECTE UNIQUEMENT — COMPTES EN QUARANTAINE. NON UTILISABLES PAR LE ML, LES BACKTESTS OU LE LIVE.**
    Mapping recherché sur tout l'univers FR S6C, pas sur tous les titres Euronext.
    Seuls les SIREN vérifiés sont collectés ; les exclus et leurs motifs sont affichés ci-dessous.
    Collecte répartie avec reprise : un passage réussi ne signifie pas que tout l'univers a été terminé.
    **AVANT UTILISATION :** qualifier identité ISIN/SIREN, unité/échelle, devise, exercice fiscal,
    comptes sociaux ou consolidés, versions/retraits et disponibilité PIT.
    Les nouveaux comptes devront subir les contrôles automatiques correspondants ; les cas ambigus restent exclus.
    Une clôture ou un dépôt ancien ne prouve pas que le contenu collecté aujourd'hui était disponible historiquement.
    À chaque décision, n'utiliser que les données effectivement disponibles avant son heure.
    Tester les features qualifiées hors échantillon contre une baseline sans fondamentaux INPI avant toute promotion,
    puis réévaluer périodiquement ou après changement important, pas à chaque collecte.
    Aucune écriture SQL, aucune alimentation des features. Voir doc/fr/inpi_univers_collecte_securisee.md.
    Archivage renforcé : comptes publics complets, horodatages, preuves de mapping par passage,
    pages de références et motifs d'exclusion conservés. PDFs/annexes non collectés ; contenus confidentiels/retirés non archivés.
    La sauvegarde fr_artifacts_backup inclut ces fichiers via artifacts/fr.
  log_file: log/batch_fr/fr_fundamentals_sync.txt

fr_consensus_snapshot:
  enabled: true
  status: ACTIVE_RESEARCH
  priority: P3
  provider: yahoo_finance_research
  run_hours: "20"
  identities_file: artifacts/fr/sprint6c_reference/identities.jsonl.gz
  universe_mode: all_verified_active
  pilot_symbols: [OR.PA, SU.PA, BN.PA]
  identity_checks:
    OR.PA:
      isin: FR0000120321
      yahoo_long_name: "L'Oréal S.A."
      official_url: https://www.loreal-finance.com/fr/laction
      reviewed_on: "2026-10-05"
    SU.PA:
      isin: FR0000121972
      yahoo_long_name: "Schneider Electric S.E."
      official_url: https://live.euronext.com/en/product/equities/FR0000121972-XPAR
      reviewed_on: "2026-10-05"
    BN.PA:
      isin: FR0000120644
      yahoo_long_name: "Danone S.A."
      official_url: https://www.danone.com/investors/shareholders/faq-and-contact.html
      reviewed_on: "2026-10-05"
  max_symbols_per_run: 400
  max_endpoint_calls_per_day: 2400 # 7 méthodes x 294 titres = 2058 ; marge bornée pour les reprises, pas un quota fournisseur.
  archive_extra_methods: [get_eps_revisions, get_recommendations, get_upgrades_downgrades]
  max_attempts_per_symbol_per_day: 2
  request_interval_seconds: 1.5
  description: "Consensus prospectif Yahoo sur l'univers FR S6C actif vérifié : recommandations, objectifs, EPS/revenus et tendances EPS. Collecte de recherche uniquement, en quarantaine."
  tables: "aucune SQL; fichiers:artifacts/fr/operations/fr_consensus_snapshot"
  universe_scope: "330 identités du référentiel S6C, 294 marquées actives ; marchés Paris XPAR/ALXP/XMLI, exclusions ISIN/alias et noms Yahoo explicites. Pas tous les titres Euronext."
  coverage_description: "Snapshot réellement observé à J, reprise des titres incomplets du jour ; les succès ne sont pas rechargés le même jour. Pas de reconstruction J-7/J."
  research_notice: >-
    **COLLECTE ACTIVE EN QUARANTAINE — PAS ENCORE UTILISABLE PAR ML/BACKTEST/LIVE.**
    Yahoo non officiel, recherche uniquement. Parcours du référentiel actif, pas garantie de consensus sur tous les titres.
    Ambiguïtés, noms contradictoires et absences sont explicités ; un nom concordant ne certifie pas un ISIN Yahoo.
    Historique construit uniquement à partir des vraies observations UTC ; pas de reconstruction du passé avec les valeurs reçues aujourd'hui.
    **AVANT UTILISATION :** qualifier identités, devises, unités, exercices fiscaux et droits d'usage.
    Construire les features de révision entre snapshots réellement collectés et comparables : même titre,
    même indicateur, même exercice, même devise et même unité ; un changement d'exercice n'est pas une révision.
    Contrôler chaque nouveau snapshot et calculer ses révisions après qualification ; les données manquantes restent manquantes.
    À chaque décision ML/backtest/live, imposer available_at antérieur à l'heure de décision.
    Tester l'apport hors échantillon contre une baseline sans consensus, avec purge des horizons futurs
    et résultats LONG/SHORT séparés ; réévaluer périodiquement ou après changement important, pas à chaque collecte.
    Ces étapes de promotion ne sont pas encore réalisées par la collecte : aucun gain D1/D10 démontré.
    Aucun SQL ni modèle modifié par ce batch. Voir doc/fr/consensus_collecte_quotidienne.md.
    Archivage renforcé : réponse info complète, tableaux de révisions EPS et recommandations disponibles,
    reçus par endpoint même si le passage est ensuite interrompu, version et heures UTC.
    Exercices/unités restent non qualifiés. La sauvegarde fr_artifacts_backup couvre la quarantaine.
  activation_requirement: "Collecte fichiers autorisée sur tout le référentiel actif. Promotion ML/backtest toujours bloquée : identité indépendante, unités/exercices, contrat PIT, droits d'usage et validation OOF nécessaires."
  log_file: log/batch_fr/fr_consensus_snapshot.txt

