[mypy]
python_version = 3.12

# Niveau de rigueur : intermédiaire (progressif vers strict)
# Pour passer en mode strict complet : ajouter strict = True
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_reexport = True
show_error_codes = True
pretty = True

# Ignore les bibliothèques tierces sans stubs (évite le bruit)
ignore_missing_imports = True

# Modules avec stubs disponibles (vérification complète)
[mypy-pandas.*]
ignore_missing_imports = False

[mypy-sqlalchemy.*]
ignore_missing_imports = False

# Exclusions : fichiers de migration SQL/prompts, caches
exclude = [
    "database/sql/",
    "prompt/",
    ".pytest_cache/",
    "htmlcov/",
]

# Tests : règles assouplies (assert, Any tolérés)
[mypy-tests.*]
disallow_untyped_defs = False
ignore_errors = False

